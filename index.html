<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAIGOノート</title>
<style>
  :root{
    --bg: #F8F6F1;
    --panel: #FFFFFF;
    --ink: #26221E;
    --ink-soft: #6E675E;
    --line: #E8E2D6;
    --accent: #8B5E3C;
    --accent-soft: #F3E7D8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
    line-height:1.8;
  }
  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:40px 20px 80px;
  }
  header{
    margin-bottom:26px;
  }
  .brand{
    font-family:"Times New Roman","Hiragino Mincho ProN",serif;
    font-size:30px;
    letter-spacing:.04em;
    margin:0 0 4px 0;
    font-weight:500;
  }
  .brand-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 22px 0;
    letter-spacing:.05em;
  }
  .toolbar{
    position:sticky;
    top:0;
    background:var(--bg);
    padding:12px 0 14px;
    z-index:20;
    border-bottom:1px solid var(--line);
  }
  .search-box{
    width:100%;
    padding:13px 16px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    font-size:15px;
    color:var(--ink);
  }
  .search-box:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .meta-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:10px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .ctrl{
    background:none;
    border:none;
    color:var(--accent);
    font-size:12.5px;
    cursor:pointer;
    padding:2px 4px;
  }
  .ctrl:hover{text-decoration:underline;}

  .list{margin-top:8px;}
  .card{
    border-bottom:1px solid var(--line);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:18px 4px;
    cursor:pointer;
    color:var(--ink);
    font-family:inherit;
  }
  .card-head:hover .card-title{color:var(--accent);}
  .chev{
    flex-shrink:0;
    width:16px;
    height:16px;
    border-right:2px solid var(--accent);
    border-bottom:2px solid var(--accent);
    transform:rotate(-45deg);
    transition:transform .18s ease;
    margin-top:-4px;
  }
  .card.open .chev{transform:rotate(45deg); margin-top:2px;}
  .card-title{
    font-size:17px;
    font-weight:600;
    flex:1;
    letter-spacing:.01em;
  }
  .card.open .card-title{color:var(--accent);}
  .card-body{
    display:none;
    padding:0 4px 28px 30px;
  }
  .card.open .card-body{display:block;}
  .sub-links{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:18px;
  }
  .sub-link{
    font-size:11.5px;
    padding:4px 11px;
    border-radius:20px;
    background:var(--accent-soft);
    color:var(--accent);
    line-height:1.5;
  }
  .body-text{
    font-size:15.5px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .body-text .h{
    display:block;
    margin:22px 0 6px;
    font-weight:700;
    color:var(--accent);
    font-size:15.5px;
  }
  .body-text .h:first-child{margin-top:0;}
  mark{background:#FCE8AE; padding:0 2px; border-radius:3px;}
  .empty{
    padding:60px 0;
    text-align:center;
    color:var(--ink-soft);
  }
  @media (max-width:640px){
    .wrap{padding:26px 16px 60px;}
    .brand{font-size:25px;}
    .card-title{font-size:16px;}
    .card-body{padding-left:28px;}
  }
</style>
</head>

</div>

{title:"人を読む", status:"done", body:`ビッグファイブを理解する。

■ インスタントビッグファイブ（フィンガーメソッド）
指ごとに5つの特性を割り当てて簡易診断する方法。1〜5で「全く当てはまらない〜よく当てはまる」を採点し、合計0以下で低め、1以上で高め。

{title:"言語化", status:"done", body:`言語化できると最強。正直難しい言語化能力。一回身につけたら衰えない。

【言語化能力があると何がいいのか】
1. 難しい形のないものを明示化する
2. パフォーマンスを安定させる（競争で勝てる／競合を作れる）
3. イノベーションを促進する（直感や経験を言語化、過去の失敗から学ぶ）
4. 学習能力と能力開発を促進する
5. 生産性を向上させる（暗黙知を言葉にして人を動かす）

【言語化を高める方法】
・メタファー（比喩や例え）
・アナロジー（類推・論理）
・アブダクション（仮説的推論）
・デザイン思考（暗黙知を図に示す）
・プロセス分解（やり方を分解する）
・ひたすら経験する

■ メタファーのトレーニング
異質なものの中に共通点を見つける訓練。1日3つ作る。
①テーマの特徴を書き出す →②自由連想を広げる →③トーンを定める →④比較文で表現を模索 →⑤比喩的な文章（メタファー）に変換。

■ アナロジーのトレーニング
自分の知っている知識・経験を、知らない分野に当てはめて推論する。
ステップ：①対象を選ぶ →②様々なジャンル（自然・スポーツ・旅行・音楽・料理・建築・映画・絵画・科学・ゲーム・歴史）から連想 →③マインドマップで展開 →④類似点をつなげる →⑤洞察を深め解決策を具体化。

■ アブダクション（仮説的推論）トレーニング
仮説→検証→答え、のプロセス。日常生活の現象から仮説を立てる癖をつける。
①観察スキル強化（先入観を排して客観的に観察／日常ルーティンの分析／環境とインタラクションの観察／視点をずらす）
②仮説生成（シナリオベース／逆仮説／データからの仮説抽出）
③仮説検証（追加の観察・インタビュー・調査などで確かめる）

トレーニングゲーム：推理小説・パズルで仮説を立てる／自己説明／ジャーナリング／発散思考／マインドマップ／「なぜ」を5回繰り返す／メンタルシミュレーション／別視点エクササイズ。

【構造化フレームワーク（説得力を高める話し方）】
・PREP法：結論→理由→具体例→結論
・SDS法：サマリー→詳細→サマリー
・クライマックス法／アンチクライマックス法：オチを最後に置くか最初に置くか
・DESC法：状況説明→意見・感情→具体的要望→結果（クレーム対応向き）
・STAR法：状況→課題→行動→結果（自己PR・実績報告向き）
・FAB法：特徴→利点→利益（セールス向き）
・AIDA：注意→興味→欲求→行動（購買意欲を高める）
・Why?What?How?：理由→要点→方法
・PPF法：過去→現在→未来（人生経験や変化を語る）
・SPE法：意見→理由→事例（簡潔なアドバイス）
・CAR法：文脈→行動→結果（日常会話の基本、これができないと信頼を失う）
・EEC法：経験→説明→結論（雑談で誘う時にも使える）
・RER法：理由→事例→再提示（価値観・信念を語る、エビデンスがない話向き）
・ARE法：主張→理由→証拠（ディスカッション向き、PREPの短縮版）
・Oreo法：意見→理由→事例→意見（カジュアルな会話向き）

【まとめ】
フレームワークは意識して使わないと身につかない。最初は文章で練習し、体に染み込ませる。言語化能力が高い人は多くの「型」を持っている。`},

{title:"天才", status:"done", body:`■ 天才はこう考える〜人生変える思考力の身につけ方
・天才は着眼点が違う。問いが間違っていると正しい答えにたどり着かない＝天才は「問いを立てる」のが上手い。
・好奇心が習慣になっていることが問いの立て方の源。好奇心が高い人は収入が上がりやすく、成長も早く、モテる。好奇心・想像性・モチベーションは科学の成績の15.5%、数学の成績の33.1%を説明できる。
・好奇心には2種類：発見好奇心（新しいことを知る純粋な喜び）と欠乏好奇心（知識の欠乏を埋めたい欲求）。大人は欠乏好奇心を活用しつつ、発見好奇心とバランスを取るべき。
・好奇心を維持できるかは「自己関連性」（自分との関係性）を見出せるかにかかっている。自己関連性が高いほど記憶も強化される。本を読む時は自分の人生との関連を5〜10個メモするのが有効。
・ソクラティッククエッショニング：明確化／前提条件／仮定／根拠／期限／影響／視点の7要素で1テーマを3〜10分ずつ掘り下げる。
・クリティカルシンキング4ステップ：①前提条件を疑う②文脈の重要性を認識③他の選択肢を3つ以上探す④試行錯誤する。
・クリティカルシンキングができない人の特徴：実践不足／捉え方の誤解／直感への依存／バイアスと感情に振り回される。
・具体と抽象の行き来：Howで具体的な問い、Whyで抽象的な問いを引き出す（それぞれ最低4回繰り返す）。ネガティブな出来事は抽象化せず具体的に考える。
・GISTリーズニング（要約的推論）：①情報を把握②重要ポイントを特定③要約を作成④推論を行う。他人の失敗談から教訓を引き出す時に有効。
・まとめ：天才とは答えに一発でたどり着く人ではなく、複数の視点を持ち、失敗しても次々に試せる人。

■ 超思考法：天才を超える凡人になるための思考トレーニング【前編】
・神童が成功しづらい理由：クリティカルシンキングを鍛えない（すぐできてしまうため）、挫折に弱い。凡人はクリティカルシンキングでしか勝負できない＝これがブルーオーシャンを見つける力になる。
・クリティカルシンキング＝特定の問題のファクトやデータに基づき客観的に分析すること。
・出来ない3つの理由：①やり方を知らない②継続できない（批判に耐えられない）③続ける勇気がない。
・クリティカルシンカーの6つの習慣：
 1.同定（今どんな問題と向き合っているか確認）→3つの質問「誰が何をしているか」「原因は何か」「結果はどうなっているか」
 2.調査（情報源を調べる）→「どこから情報を得たか」「正当なソースか」「雑誌かアカデミックジャーナルか」
 3.バイアスの同定（鵜呑みにしない）→「誰が得をするか」「意図はないか」「隠している情報はないか」
 4.推論（結論はいつも揺らぐことを前提に）
 5.関連性の判断（自分の思考にとって最重要な情報は何か）
 6.好奇心（オープンエンドクエスチョンを使う）
・DaiGoは研究者を諦め、クリティカルシンキングを「思考のポートフォリオ」として使う道を選んだ（一つの領域で勝つのが天才、複数の視点で勝つのが凡人の戦略）。

■ 超思考法：天才を超える凡人になるための思考トレーニング【後編】
・5つのクリティカルシンキング思考法：
 1.ライティング（弁証法）：テーゼ（メリット）とアンチテーゼ（デメリット）の間を取ってジンテーゼ（新しい視点）を作る。例：「安定してお金が欲しい」×「リスクは取りたくない」→「副業」というジンテーゼ。
 2.CAT法：1問5〜6分で①重要度②印象③混乱④要約の4つの質問に即答する。強制的に視点を変える。
 3.CLS法：他人との共同学習。①議題の定義②根拠の議論（根拠のないアイデアは不採用）③全員参加。DaiGo流は「一番良いアイデアは言わない」。
 4.ケーススタディ法：物議を醸す事例を選び、事実と推測を切り離して箇条書きにしてから思考する。
 5.クリティカルクエスチョン：互恵的ピアクエスチョン（お互いの意見以外に方法はあるか）／リーダーズクエスチョン（匿名で問題を書き出す）／会議スタイル学習。
・「なぜという問いはその答えの100倍重要である」（アインシュタイン）。
・最強のクリティカルシンキングとは「同じ成果のまま、いかに手間を減らせるか」を考えること。`,
 subs:["天才はこう考える〜人生変える思考力の身につけ方","超思考法：天才を超える凡人になるための思考トレーニング【前編】","同【後編】"]},

{title:"質問力", status:"done", body:`7つのサブページ全て読み込み済み（超質問力#2は中身が空でした）。

■ 【FBIの質問力】テロリストの心すら変える聞き方
相手の心を変える9つのテクニック：①無知のモデル化②単語のすりあわせ③調整された質問④道徳的一致⑤ネット上の議論禁止⑥影響フォーカス⑦認識論的質問⑧ラーニングフレーム⑨13の「べからず」。
・調整された質問の4ポイント：①オープンエンド・クエスチョン②話題の明確化③脱線したら戻す／再確認④主張を質問に見せかけない。
・道徳的一致の4ポイント：①道徳的に一致する部分を探る②自分の極端さを認める③相手の極端さは非難しない④共通の敵を作る。ネット上の議論は基本禁止。

■ 超質問力＃1
・質問は命令より相手の脳に直接働きかける。営業成績と質問回数には強い相関（相関係数0.7）。「営業は何を言うかではなく何を言わせるか」。面接の合否も逆質問で左右される。
・質問しない理由：①自己中心的②他人に無関心③自信過剰④完璧主義。
・フォローアップの質問が人間関係を変える：具体的質問と背景を尋ねる質問を使い分け、5W1Hで広げる。

■ 聞いて操る！心理操作系質問テク＃3
・他人の考え方を変える3つのテクニック：①オープンな質問（理解の浅さを露呈させる）②視点を変える質問（バイアスを揺さぶる）③未来思考の質問（ミラクルクエスチョン）。
・自由回答とYes/Noの使い分け：緊張した交渉／はぐらかす相手／確認・合意／デリケートな話題はYes/No。深掘り／アイデア／圧力回避／バイアス回避は自由回答。
・交渉の基本フロー：①Yes/Noでポジション明確化②自由回答で情報収集③Yes/Noで合意。競争的会話 vs 協力的会話でテクニックを使い分ける。

■ 心を打ち抜く質問テク＃4（信頼と本音を引き出す）
・弱みを「打ち明ける」（ぶちまけない）ことが信頼構築の鍵。対極的な質問で向上心を見せる。他人を巻き込む質問で味方を増やす。
・逆質問法：目的の逆を考えてリスクや新視点を洗い出す。洞察を生む8つの質問パターン：過去から学ぶ／未来を見据える／視点を変える／想像性を刺激する／失敗から学ぶ／感情にフォーカス／知識の限界を知る／他人への影響を考える。
・率直な意見を引き出す5プロセス：①好奇心シフト②安全な環境を作る③レジリエンスを示す④質の高い質問（原因特定→視点確認→解決策）⑤学ぶ姿勢で傾聴（内容・感情・行動の3チャンネル）。

■ モテる話題とその聞き方＃5
・スモールトークから早めにディープトークへ移行するのがモテる人の特徴。盛り上がる質問例：「今一番情熱を注いでいることは？」「最高のプレゼントは？」「普段の1日は？」「一生1種類しか食べられないなら何を？」「今日驚いたことある？」「一番良かったアドバイスは？」「友達はどんな人？」「子供の頃どんな子だった？」「何にイライラする？」「学びたいことは？」「最も誇らしいことは？」「恋愛で大事にしている価値観は？」「最も大きな決断は？」「理想と現実のギャップは？」「幸せとは？」など。制限をつけた質問ほど会話が広がる。最後は必ずポジティブな話題で締める。

■ ミスらないパートナー選び＃6
・確認すべき5つのポイント：①コミットメントレベルの一致②建設的なコミュニケーションと相互尊重③信頼と誠実さ（浮気の線引き共有）④金銭感覚の一致（離婚原因の約半数がお金）⑤根本的な価値観・ニーズ・目標の共有。
・関係における「13のニーズ」：個人的／お金／現在と将来の家族／パーソナルスペース／恋愛関係／ソーシャルキャピタル／時間／仕事／困難への対処／文化／アイデンティティ／身体的価値観／哲学。これらを話し合って「パートナー関係のトリセツ」を作ることを推奨。`,
 subs:["【FBIの質問力】テロリストの心すら変える聞き方","超質問力＃1","超質問力#2（中身空）","聞いて操る！心理操作系質問テク＃3","心を打ち抜く質問テク＃4","モテる話題とその聞き方＃5","ミスらないパートナー選び＃6"]},

{title:"キャリアの選び方", status:"done", body:`幸せになる仕事とキャリアを選べるようになろう。多くの人は仕事の選択を間違えている。「向いているか」を悩むのは無駄で、始めてから工夫することが大事。

【仕事のパフォーマンスは事前予測できない】
職業適性検査とパフォーマンスの相関（括弧内は相関係数）：
サークサンプルテスト(0.54)／IQテスト(0.51)／構造化面接(0.51)／ピアレーティング(0.49)／職業知識テスト(0.48)／企業への忠実性(0.41)／通常の面接(0.3)／類似業界の経験(0.18)／教育レベル(0.1)／履歴書の筆跡(0.02)／年齢(-0.01)

【幸せなキャリアの選び方 8か条】
① 給料を気にしすぎない（満足度との相関は0.1以下）
② 手軽な仕事を選ばない（達成感が得られずキャリア満足度が低下）
③ 好きを仕事にしない（人の好みは変化する。得意なことを仕事にする方が良い）
④ エンゲージメントの高い仕事に就く（自治性／明確性／多様性／フィードバックがある仕事）
⑤ 他人の助けになる仕事をする（1日5回の親切で満足度UP）
⑥ 好きより得意なことを仕事にする
⑦ 同僚の質を重視する（何をするかより誰とするか）
⑧ ネガティブと向き合う（満足度を下げるトップ4：長時間通勤／長時間労働／賃金の不公平感／仕事の不安定感）`},

{title:"営業", status:"done", body:`【営業力を上げる12のNot to Doリスト】
やりがちなものを1〜2個選んで「しない」トレーニングをする。
1. 頭の中で違うストーリーを展開しない（空想NG）→対策：定期的な要約の返し、共通体験を探す
2. 頭の中で反論しない→対策：疑問興味モードで尋ねる、自ら気づかせる
3. ネガティブな感情に飲まれない→対策：クリティカルシンキング、呼吸を落とす
4. アドバイスは最後までしない→対策：まず共感、3回求められたら助言
5. 単調な相槌を打たない→対策：相槌のバリエーションを意識
6. 次の話を考えない→対策：質問されるまで聞く練習、鉄板ネタを用意
7. 話の流れを変えない→対策：最後まで聞く、確認を取ってから話す
8. 不意打ちをしない→対策：最大限相手を擁護してみる
9. 都合のいいところだけ聞かない→対策：聞き逃しを確認する
10. 反対意見に怯えない→対策：批判から学べることを考える、ゲームとして扱う
11. 自分に都合の悪い話は聞かない→対策：反対意見をゲーム的に聞き出す
12. 間違ったら速攻で口に出す→素直さが信頼関係を築く

■ 敵に物を売る（「ノー」と言わせない営業術）
・相手が「ノー」と言えない言葉づかいを徹底する。3つのポイント：
①二人称を使わない（you/yourを避け、Weを使う。ベテラン交渉人ほどWeを使う。「私は反対です」ではなく「私は懐疑的です」と言う。レッテルを貼らない）
②会話をリフレーミングする（共通点を中心話題に／公共の利益を話題に／ネガティブをポジティブに変換する）
③スケール（数字）を導入する：「10点満点で言ったら？」で行き詰まりを解消。比較スケール、重要度比較スケール、自信スケール（「なぜ8点なのか、2点の差は何か」と聞く）、スケールを上げる方法を聞く。

■ アウトソーシング戦略（興味ない人に売る＝取り付く島もない人を交渉可能にする）
・アウトソーシング＝外部の情報・権威に話題を移して信頼感を高めるテクニック。9つの戦略：
①反論の最後にアウトソーシングを使う（「どんなデータがあれば考えを変えるか」と聞く）
②中立的な第三者なら何で納得するかを聞く
③対立解決に必要なデータについて聞く
④関係する専門家について聞く
⑤反対する専門家を3人挙げてもらう（多角的検討をしていないことに気づかせる）
⑥検証不可能な道徳の話は早めに避ける
⑦行き詰まったら同意できる点を確認する
⑧結論を急がず次回に持ち越す（アウトソーシング＋ゴールデンブリッジの合わせ技）
⑨拒絶されたら統計より具体例・逆説的な極論をぶつける（30%の確率で態度が変わる）
・「スリーパー効果」：最初のインパクト＋後からソースの権威性が明らかになると、半年〜1年かけて意見がじわじわ変わる。

■ ゴールデンブリッジ戦略（相手に恥をかかせず信念を修正させる）
・人が信念を変えられない根源的理由は「恥をかきたくない」から。7つのポイント：
①自分がされたいことをせよ（追い詰めずに助け舟を出す）
②外交的手榴弾の禁止（「だから言ったじゃないか」等はNG。未来志向の会話に切り替える）
③雰囲気の描写（「空気が悪くなりましたね」と実況するだけで対立を和らげる）
④明示的同意（同意は言葉にする、反論はあえて言わなくてよい）
⑤逃げ道の提示（「状況が同じなら自分もそうしていた」、プロでも間違えるという話、心理的安全性の確保）
⑥自分の無知に言及する（自分の失敗談を先に話しメンツを保つ機会を与える）
⑦交渉にはif-thenプランニング（「もしXが起きたらYをする」を事前に決めておくと交渉成功率が約80%に向上）。`,
 subs:["敵に物を売る","アウトソーシング戦略　興味ない人に売る","ゴールデンブリッジ戦略"]},

{title:"一流　トップ", status:"done", body:`■ トップに上り詰める5つの練習
①練習は1日15〜20分にする（継続できる量からスタート、量を増やすのは慣れてから。80日は量を増やさない）
②ミスは全て記録する（原因と感情を記録し、フィードバックの材料にする）
③デッドラインを厳しく設定する（重要なことから手をつける、締切が近いものだけやっていないか自問）
④「疲れなければ練習ではない」（多少の負荷がある練習にする。疲れなくなったら難易度を上げる）
⑤時々ふざける（最後の数分は楽しめる練習を入れて飽きを防ぐ）
・スキル習得の達成率：目標を持つだけ10%／誓う25%／いつやるか決める40%／練習計画を作る50%／他人にシェア65%／一緒に練習する人を見つける95%。

■ 一流トップ②：スキル習得率を最大3倍高める方法
①メディアの多様性を利用（本・オーディオブック・Kindleなど複数の学び方を組み合わせる。聴覚を使うと1.2倍向上）
②手探りで練習する（習うより慣れろで1.2倍上達。教わってから始めるより経験してから学ぶ方が良い）
③自分の言葉でメモる（手書きは記憶に残りやすい）
④惜しい間違いで1.2倍上達（何歳になっても試行錯誤を怖がらない）
⑤自分が使う想像をするだけで3倍上達（自分の生活と関連付ける）
⑥複雑なスキルは実生活と密接にすると習得しやすい
⑦忙しい人ほどスキル習得が高い（頭の回転が早くなる）
⑧他人を巻き込むと習得率が15%UP（週1回の共有だけでも良い）
⑨移動学習で1.5倍向上（複数の場所で学習する）
⑩テレビゲームで注意力・認知制御力UP
⑪短時間の高負荷運動（HIIT）をスキル習得直前に行うと良い
⑫学んだ4時間後に高強度運動をする
⑬イメージトレーニングは実際の練習と同等の効果（ただし体で覚えてから）
⑭寝る直前に練習すると記憶の定着率が上がる。

■ 覚えが早い人はやってる「倍速上達法2.0」
・上達もスキルであり練習で身につく。5つの誤解：お手本を完全に真似るのは短期的には良いが長期的にはマイナス（差分に注目してピンポイント改善する方が良い）。
・ブロック練習（1スキル特化）からランダム練習（複数スキルを混ぜる）へ：長期的にはランダム練習の効果が高い。科目や作業をシャッフルすると定着しやすい。
・コンディショニングゲーム：本番に近い特定状況を再現する練習。
・フィードバックは減らし、自分で気づかせる質問にする方が長期的に良い。
・座学も重要（ゲームインテリジェンス、予測力は座学でも補える）。
・卓越したスキルを身につける5つの方法：①模倣と内省の組み合わせ（真似すぎず自分でアレンジ）②量より質（維持練習ではなく意図的練習）③インターリービング学習（関係ない知識も混ぜる）④本番に特化した練習条件を作る⑤自分だけのチャレンジポイントを探す（他人の練習法に振り回されない）。
・練習構成は自分で考える（1〜10まで教わるのではなく自分で発見する方が定着率が高い）。
・練習中はうまくいってるか考えすぎない方が良い（練習を考える時間と実行する時間を分ける）。
・再固定化：6時間程度間隔を空けて少し変化をつけて反復すると定着しやすい。
・不快感を積極的に求めた方がモチベーションと定着率が上がる（不快感＝前進のサイン）。
・トップパフォーマーは練習初期に成功体験（心理的な勢い）を作るのが上手い。自己効力感・楽しさの感情が上達を左右する。`,
 subs:["一流　トップ","一流トップ②","覚えが早い人はやってる「倍速上達法2.0」"]},

{title:"成功", status:"done", body:`■ #1 成功を妨げる3つの罠（ポジティブ思考で成功できない理由）
・皆が信じる3つの誤解：ポジティブ思考・情熱を追う・協調性を持つ。
・ポジティブ思考の罠：ほんの少し気分が良くなる代わりに鬱になる確率が増え7ヶ月以上続く。無駄に期待を上げ挫折を大きくする。ポジティブ思考の人ほど目標達成率が低い（達成したと錯覚しモチベーション低下）、モテない、成績が低い、採用率・給料が低い、怪我の回復が遅い。
・ポジティブ思考が逆効果なジャンル：①非現実的な空想をしやすい（株・副業）②予測が立てづらい（ビジネス）③客観視しづらい（ビジネス・恋愛）。
・対策：期待をしすぎない、失敗を想定する、途中の障害への対応策を考える。

■ #2 ネガティブな予測が人生を変える
・ポジティブな人が空想すると無駄な期待を自他に抱かせる。「空想より予想」（事実に基づいた具体的思考）。
・ネガティブ思考は論理的思考を促し不安を分析・明確化する。ポジティブシンキングは自分でどうにもできない状況の一時しのぎ（ロキソニン的）としてのみ有効、行動は別で計画する。

■ #3 成功したいなら情熱と協調性を捨てよ
・情熱を追うと新しい可能性を探求しなくなる。情熱は仕事の過程で後から湧くもの（グロースパッション）。情熱より大切なのは①新しい可能性を求める②価値観を求める③自分を評価する記録。
・仕事への3つの考え方：アイデンティティ思考／貢献思考／実践思考（職人気質）→実践思考の人が最もスキルが伸びる。
・幸福感を決める4要素：自分の意志で行動できるか／社会の役に立てるか／他人との繋がり／スキル向上の実感。
・協調性は無くて良い：協調性が高いと破産リスク1.5倍、アドバイスがもらえず年収が下がる、昇進しにくい。対策：信頼できる人の成功を助けるポジション、上下関係の少ない企業、トップギバーと付き合う。

■ #4 衝動抑制力（前編）
・成功に必要な7つの能力：①衝動抑制力②感情安定力③グリット④楽観性⑤好奇心⑥IQ⑦運。中でも衝動抑制力（セルフコントロール）は最も鍛えやすい万能能力。
・4歳時点のセルフコントロール能力の高さが高校生時の健康・成績を予測する。
・鍛える7レッスンの1つ目＝自己調整学習（SRL）：①プランニング（WOOP、If-Thenルール、チートデイ、挫折の計画）②モニタリング（マインドマップ、メモで記録）③リフレクション（30分ごとの振り返り）。

■ #5 感情安定力
・感情の安定＝生産性の安定。メンタルが弱いと集中力が続かず外部刺激に弱い。神経症的傾向が高いと年収が下がりやすい。
・ERQテストで自分の感情の揺れやすさを知る。感情制御ワークシート（6つの質問：原因／解釈／点数化／周囲への影響／行動への影響／判断への影響）で客観視する。

■ グリット（あきらめない力）
・グリットは学習可能。若い頃の粘り強さ（5分間ハードな運動を続けられるか）が人生の成功と相関。
・グリットを鍛える5つの思考法：①成果より努力・プロセスを評価する言葉を選ぶ②達成目標より学習目標に切り替える③競争ゴールを共同ゴールに④社会的帰属を意識する⑤チャレンジングゴール（程よく難しい目標）を作る。
・柔軟なグリットのための3つのリソース：同じ経験を共有できるコミュニティ／同じ困難を乗り越えた人の本や記事／トラウマ対処法の情報を集める。

■ セルフレギュレーション（後編：衝動を抑える7つの技術）
・誠実性は学習可能で仕事と人生の98%に良い影響。7つのテクニック：①誘惑のない環境づくり②If-Thenプランニングで行動を変える③尊敬／軽蔑のロールモデルを作る（獲得ゴール／予防ゴール）④衝動抑制が上手い友達と付き合う⑤感謝の気持ちを持つ⑥循環型思考（未来は今日の繰り返し）⑦過去の自分のずるや不正を紙に書き出す。

■ 楽観性の鍛え方
・楽観性はしんどい時に6倍のモチベーションを発揮する。楽観的な人は29%生存率が高く、貯蓄率も高い（楽観90% vs 悲観70%）、昇進率40%高い。
・「悲観的に予測し楽観的に行動する」＝マスタリー思考。楽観悲観尺度テストで自分の傾向を知る。
・ABCDE反論法：A逆境（ネガティブな出来事）→Bその解釈→C結果・行動→D反論（その解釈は正しいか？）→Eエナジャイジング（楽観的な再解釈）。成功者の伝記をこの型で分析するのも有効。

■ 好奇心の鍛え方（若いうちから成功したい人向け）
・好奇心が強い人は出世が2倍、昇進理由の18%を占める。CQ（好奇心指数）が最も鍛えやすい。
・CQを鍛える方法：①退屈を感じたら10%アレンジする②乱読（色々なジャンルを少しずつ）③興味リストを作る（ダヴィンチ方式）④馬鹿な質問をしまくる⑤小さなフラストレーションに注目し記録する⑥他人の解決策を観察し改善案を考える⑦Ifの質問を習慣化する⑧ビギナーズマインドで物事を眺める。

■ 常識破りの成功法則（他人の失敗を見まくり、情熱は趣味に注ぐ）
・6つの裏技：①下積みの経験を無視する（異業種の知識を組み合わせる方が強い）②外部にメンターを探す（異業種で、脆弱性を見せられる関係）③他人の失敗を見まくる（反面教師）④最初のフォロワーになる（先行者の失敗率47%、フォロワーは8%）⑤意図的に制限をイメージする（渇望を作る）⑥10倍良いものを考える（コツコツ改善ではなく発想を変える）。
・情熱は仕事以外（趣味）に注ぐ方が仕事もプライベートも充実する。仕事と趣味がかけ離れているほど良い。
・所属コミュニティは複数持つ。友人は①有能な友人②ジャンルの違う友人を持つとモチベーションもセルフコントロールも向上する。孤独はパフォーマンスを下げる。`,
 subs:["成功を妨げる3つの罠","ネガティブな予測が人生を変える","情熱と協調性を捨てよ","衝動抑制力（前編）","感情安定力","グリット","セルフレギュレーション（後編）","楽観性の鍛え方","好奇心の鍛え方","常識破りの成功法則"]},

{title:"苦痛学", status:"done", body:`■ 【苦痛学】人生変わる苦痛の科学的利用法
・SuperAger（歳をとっても脳が衰えない人）になるには積極的不快感が必要。難しい活動にチャレンジし苦痛を得ないと脳はあっという間に衰える。
・人間は不幸を感じるようプログラムされている（3つのバイアス：①未来は良くなるだろう②昔は良かった③幸せにはすぐ慣れる）。不幸を感じやすい方が生存率が高かった。
・行動に結びつかない不幸は無駄。不幸・苦痛を避けようとするのは無意味で、むしろ貴重なもの。
・不幸や不満を乗り越える3つの方法：①記録する②隠れた自分のミスや弱点を見つける③マインドフルネスを学ぶ。
・意味のない3つのこと：①幸福至上主義（幸福を追い求めるほど幸せは減る。行動によってのみ幸福は手に入る）②他人と比較する行動（SNSで比較時間が長いほど不幸になる）③退屈を否定する行動（何もしない時間も大切）。
・幸福を忘れる4つの方法：①Showing up（不幸の意味を探求する）②Stepping out（ネガティブ感情をメタ認知する：注意訓練法／デタッチドマインドフルネス／反芻の延期）③Whyの確定（幸福ではなく価値観を追う＝自己省察）④Moving on（価値観を追えば人と比較せず進み続けられる）。`},
{title:"自己省察", status:"done", body:`■ 自分を知る6つの質問と価値観リスト（ニューメキシコ大学研究より）
・95%の人が自分を理解していると思っているが、実際に理解できているのは10〜15%程度。自己省察力が高いと人生満足度が上がり、仕事に集中できる。
・自己の価値観を知る6つの質問：①どんな価値観で育てられたか、今の思考はそれに沿っているか②幼少期・思春期の最重要な出来事とその世界観への影響③職場・私生活で一番尊敬する人とその理由④一番尊敬しない人とその理由⑤最高／最悪の上司は誰でなぜか⑥子供や部下に一番伝えたいこと・伝えたくないことは何か。

■ 迷いがなくなる【内的自己省察スキル】を高める8つの方法
①なぜよりも「なに」を重視する（Whyより「何が」自分をそうさせているのかを問う方が正確な情報が得られる）
②反証の質問（悪いことからも「逆に得られるものはないか」を考える）
③対比（過去の経験・行動との共通点や違いを探す）
④1日チェック法（1日の終わりに今日の行動と選択を他人を観察するように振り返る）
⑤ライフストーリー（人生を小説のように捉え、ターニングポイントを5〜10個書き出し、意味・影響・教訓を分析する）
⑥ソリューションフォーカス（原因ではなく解決策に焦点を絞る）
⑦反芻撃退（反芻思考を止める方法：自分のミスは他人はさほど気にしていないと知る／パフォーマンスより学びに焦点を移す／すぐポジティブなフィードバックを得られる行動をする／「ストップ」と自分に言う／その反芻にエビデンスはあるか問う）
⑧360度評価法（職場・友人など多方面から自分の評価を聞く。食事をしながら聞く「ランチョンテクニック」で信頼度が上がる）。`},
{title:"超仕事術", status:"done", body:`■ 朝イチ仕事術〜朝やると1日の仕事効率が激変する行動
・モーニングルーティンを死守する（ワイオミング大学研究：朝の日課が崩れるとメンタルが不安定になり生産性が1日中下がる。勤務時間外の連絡もこの観点から避けるべき）。
・自分のクロノタイプ（朝型・夜型）に合わせて重要な仕事の時間を選ぶ（MLB選手の打率データでも試合開始時間帯と朝型/夜型の相性で成績差が出る研究。朝型は14時より前、夜型は14時以降か20時以降に大事な仕事を持ってくるのが良い）。
・最初の仕事は短時間で終わるものを選ぶ（ワシントン・ボセル大学研究：最初のタスクが中途半端だと「注意力の残留」が起き次のタスクの集中力が下がる）。
・アイデア出しは退屈を経験させた後にする（オーストラリア国立大学研究：退屈は創造性の源になり、じらすほど良いアイデアが出やすい）。
・毎日30分以下の昼寝を取る（ブロック大学とNASAの共同研究：10〜20分の昼寝で覚醒度・気分・反応速度・注意力・記憶力が向上し仕事のパフォーマンスが1.3倍に）。
・「祖先効果」を活用する（グラーツ大学等の研究：5分間祖先について考えるだけで言語能力・空間認知能力・セルフコントロール能力が向上するとされる）。`},
{title:"クロノタイプ　体内時計", status:"done", body:`■ 体内時計をハックして自分を変える
4つのクロノタイプ（体内時計のタイプ）：
・ライオン型（人口の15〜20%）：楽観的・現実的、朝型、昼に能力全開、睡眠7時間以上
・クマ型（人口の50%）：親切・開放的、お昼〜昼過ぎに能力全開、睡眠7時間以上
・オオカミ型（人口の15〜20%、アーティストに多い）：創造性が高く気分屋、感情に沿って行動、睡眠7時間くらい
・イルカ型（人口の10%、不眠型）：知性が高く神経質、完璧主義の罠、夜型、睡眠6時間くらい

クマ型（最多タイプ）のタイムスケジュール例：
7:00起床＋2〜3分運動→7:30朝食（タンパク質多め）→9〜10計画立て＋カフェイン→10〜12集中力を要する仕事→12:00昼食＋散歩→14:30〜14:50瞑想か昼寝→15〜18会議や雑用→19:30夕食→20〜22創造性が必要な仕事→22:00スマホ・PC・TV終了、入浴でリラックス→23:00就寝。（昼寝は人類に必須）`},
{title:"逆境", status:"done", body:`■ 【逆境指数AQ】最悪の状況を乗り切るための心理学
・逆境を乗り越える4指標「CORE」：①Control（どれだけコントロールできているか）②Origin/Ownership（原因はどこまで自分のせいか、事実と思い込みを分離）③Reach（人生への影響範囲）④Endurance（どれだけ続くか）。
・「学習された無力感」が逆境に弱くする（電気ショック実験の犬の話）。逆境を乗り越えられない考え方＝固定的・内在的・一般化。楽観主義は一時的・外因的・限定的に捉える。
・ハーディネス（頑強さ）＝チャレンジ・コミットメント・コントロール感。失敗とは転ぶことでなく起き上がらないこと。
・逆境を乗り越える「LEAD法」：①Listen（自分の反応に耳を傾ける）②Explorer（原因と自分の責任を探求）③Analyze（「コントロールできない証拠」「人生全部だめになる証拠」「ずっと続く証拠」の3つの無いを見つける）④Do（何をすべきか行動を決める）。
・悲観的思考が湧いたら「ストップ！法」（「ストップ」と言う／輪ゴムをパチンと弾く）で気づきを得る。逆境の時こそ人を助けると自分の存在価値を感じられる。

■ DaiGoの人生を変えた3つの挫折
①いじめ（諦める力・捨てることへの未練のなさを得た）②大学受験の失敗（人と違うことをする思考、必死にもがく経験）③TV時代の人間不信・仕事放棄（誰かに依存しない、組む相手は足し算でなく掛け算、自分の得意なことを見つめ直しニコニコ動画と本に繋がった）。失敗とは学びを放棄した過去のこと。

■ 逆境力の高い人の10の特徴
①現実的オプティミスト（ネガティブに目を向けすぎない）②恐怖から意識をそらさない③モラルコンパス（逆境になるほど他人に優しくなる）④スピリチュアリティ（畏怖感、大きなものを感じる）⑤ソーシャルサポート（誰かとのコミュニケーションを絶やさない）⑥ロールモデルを持つ⑦運動の習慣⑧生涯学習の態度⑨コーピングレパートリー（ストレス解消法を20〜30個リストで持つ、特にユーモアが重要）。

■ 悲劇的逆境から立ち直るための7つの習慣
5つの習慣：①感情予測をあてにしない（良い感情も悪い感情も長くは続かない）②メンタル免疫システムを信じる（どんな逆境も時間と共に復活する）③脳内ストーリーテラーを助ける（ネガティブなストーリーに対抗する自己正当化ストーリーをぶつける、筆記開示を使う）④行動フォーカス（内面より行動に焦点を当て、試す回数を記録する）⑤善行をする（親切をすると心に余裕ができ解決策が生まれる。5分以内でできる親切をする「5分ルール」）。
2つのポイント：①事態を悪化させる3つの思考（パーソナライゼーション＝個人化、パーベイシブネス＝普及性、パーマネンス＝永続性）を避ける、気づくだけで脱出しやすくなる②デカストロファイジング（今より「もっと最悪」な状況を考えることで目の前の問題を相対化する）。`},
{title:"意志力", status:"done", body:`■ 【減らない意志力】使えば使うほど強くなる意志の力
・ウィルパワー（意志力）は実は減らないという最新研究。減った「ように感じる」のは状況やモチベーションの問題。
・5つのテクニック：
①誘惑の少ない環境を作る（誘惑の少ない部屋、集中している人がいる環境でピアプレッシャーを利用）
②想像力（今と未来を含んだ選択肢で考える。「今誘惑に負けると未来損する」をセットで想像する）
③ゲーミフィケーション（意志力は「使うほど強くなる」と考える方が有利。タイムアタックや競い合いを使う）
④共感能力コントロール（未来の自分に共感して今の行動を決める。共感力を上げる方法：ヨガ／瞑想／祈り／自然に触れる／畏怖を感じる／自己犠牲を描いた作品／難解な作品に触れる）
⑤笑う（お笑い動画で大笑いすると集中力がブーストされ、定期的な大笑いの習慣はゾーンに入りやすくする）。`},
{title:"迎合方法", status:"done", body:`■ 職場での立場を激変させる【エンゲージメントビッグ5】
・迎合力＝自分より大きな力を味方につける力。上司との関係、スーパーバイザーとの関係、ストレスレベル、目的レベル（組織のゴールの理解）、組織イメージの5要素が職場評価を左右する。
・上司との関係が良いとストレス軽減・幸福度向上・生産性向上（成果の70%は上司との関係で決まる）。
・お世辞の力：どんな褒め言葉でもチップが33%向上する研究。お世辞は好感度を上げ有能さは下げない、自慢は好感度を下げる。

■ エリートが使う49の迎合法（ミシガン大学×南カリフォルニア大学）
7つの迎合テクニック：①お世辞のフレーミング（前置きをつける）②アドバイスシーキング（相手にアドバイスを求める）③ウインザー効果（友達経由で褒める）④議論からの迎合（すぐ迎合せず一度反発してから）⑤ホットリーディング（事前に情報収集する）⑥迎合前に一般的価値観を提示する⑦共通項の参照（共通点があるほどお世辞が通りやすい）。
7つのR（コミュニケーションのバリエーション）：①リフレーム（言い換えて自分に有利にする）②リフレーズ（ネガティブな言葉をポジティブに変換）③リビジット（相手の過去の成功を引き合いに出す）④リエステート（相手の本音を指摘して導く、上級）⑤リクエスト（要約して確認する質問）⑥リバランス（挑発してくる相手にはメンタルの強さを見せる）⑦リオーガナイズ（優先順位の変更、抽象度を上げる）。

■ 現金を配るレベルで好かれる【ホメ殺しの14の技法】
褒め方6つ：①感情を乗せる（不誠実な褒めは見抜かれる）②極端な言葉は避ける③簡単にできることを褒めない（努力した所を見抜く）④コントロールできること（努力・戦略）を褒める、生まれつきのものは褒めない⑤好きでやっていることには口を出さない（アンダーマイニング効果を避ける）⑥他人と比較して褒めない。
注意点7つ：①曖昧なお世辞をやめる（お世辞＋理由＋事例で話す）②お世辞は頻度を抑える③関係が浅い人にプライベートな褒めをしない④羨ましさをお世辞に使わない（アドバイスシーキングを使う）⑤ライバルがいる場では褒めない⑥ステレオタイプのお世辞（学歴・肩書など）をしない⑦セールストークに聞こえるお世辞を避ける。

■ 味方になる人、敵になる人の見分け方（バージニア大学研究）
・迎合すべき相手を見抜く4つの視点：①誠実さは不変ではない（状況で変化する）②権力は人を変える（地位の高すぎる人は信頼しすぎない）③無能さは自信で隠せる（自信に根拠があるか調べる）④直感は役に立つ。
・信頼できない人がよくやる4つのしぐさ：①体の向きをそらす②腕を組む③指を触る④顔を触る。
・成功者が迎合する6タイプ：①専門知識をくれるスペシャリスト②公式の権力者③アドバイザー・コーチ④個人的サポーター⑤開放性を高めてくれる変人⑥仕事とプライベートのバランスを取ってくれる人。
・失敗する人脈作りの6パターン：形式主義／外部の過剰重視／孤立主義／確証バイアス／見せかけ主義／日和見主義。
・良い人脈を作る4ステップ：①アナライズ（メリット・デメリットを分析）②レイヤーの削減（害のある人間関係を切る、問題の90%は5%の人間由来）③多様化（足りない人脈を補う）④利用のポイント（今ある人脈の別の使い方を考える）。`},
{title:"記憶力", status:"done", body:`■ #1 わざと間違えて、4秒描けば記憶力2倍
・記憶に必要な3要素：インプット力／効率的アウトプット／記憶力が高くなる習慣。再読・マーカーは効果薄い。
・①自分に問いかける②自分に説明→他人に説明③間違いがわかるフィードバック④エラー訂正法（わざと間違えて自分で修正すると学習効率UP、単純暗記には不向き）⑤ドローイング効果（覚えたい物の絵を4秒描くだけで記憶2倍）⑥手書き自体が記憶力を上げる。

■ #2 スキルアップに効く仕事で使える記憶術
・意図的な練習（どこを間違えたか明確にする）。インターリービング（反復に変化を持たせる）。ミスした部分を集中的に練習。女性は言語的記憶、男性は空間的記憶が発達しやすい。物語化すると記憶に残りやすい。パフォーマンス予測で短期記憶1.2倍UP。他人に話しかける（想像でも可）ように音読すると定着しやすい。10分の早歩きで海馬と皮質層の繋がりが強化。人生の目的意識が強い人ほど記憶が鮮明。

■ #3 やらなきゃ損する12の記憶定着法
・学習後40秒のリプレイで記憶が2週間持続。あえて忘れる努力をすると逆に定着する。覚えた後は5分歩く。15分の昼寝で記憶が長期記憶化。スクワット系の運動を挟む。大事なことを覚えたら5〜15分何もせずボーッとする（スマホ禁止）。4時間後のインターバルトレーニングで海馬活性化（直後の運動は逆効果）。自分の機嫌を取れる人は記憶力が良い。音楽・言語は睡眠学習が効く。睡眠中のピンクノイズでテストスコア3倍。思い出す裏技：後ろ向きに歩く／CCR（カテゴリー分けして記憶を辿る）。

■ #5 記憶力が勝手に高まる14の習慣
①鼻呼吸②読みにくい字でメモる（正答率86.5%に）③ポジティブ習慣を作る④ボードゲーム⑤アクションゲーム（注意制御力7倍UP）⑥音楽を習う⑦8週間のヨガ（海馬が大きくなる）⑧血糖値を上げない生活⑨1日拳6つ分の野菜・果物⑩葉物野菜を1.3倍⑪200mgのカフェイン⑫高ココアフラバノールで脳が20〜30歳若返る⑬CBD（研究段階）⑭ローズマリーの香り（成績10%UP）。

■ #6 記憶力を下げる行動（やめるだけで脳が変わる）
・変化のない生活（新規学習回路を使わない）／楽しくない学習／感動が少ない生活／恐怖を感じない生活（軽い恐怖は記憶力UP）／予想外・驚きがない生活／エロ画像（短期記憶低下）／飲酒（灰白質減少、喫煙や肥満の4倍の悪影響）／インターネット（記憶に残りにくい）／スマホでの写真撮影（被写体をよく見なくなる）／ストレス（コルチゾールで記憶低下）／砂糖（腸内細菌経由で記憶低下）／生活リズムの乱れ（ドーパミン伝達阻害）。

■ #7 至高の記憶術【メモリーパレス】
・7つのニーモニック（記憶術）：①音楽②名前（頭文字で作る）③言葉（語呂合わせ）④モデル（図示）⑤韻文⑥イメージ⑦コネクション（既知のものと結びつける）。
・最強は「メモリーパレス（記憶の宮殿）」：頭の中に建物を作り、部屋ごとに覚えたい情報をイメージとして配置する。1日30分×6週間で記憶力が2倍になった研究あり。ぼんやり時に働くDMN（デフォルトモードネットワーク）が強化され、アイデアも出やすくなる。`},
{title:"投資", status:"done", body:`■ ファンドオブザイヤー受賞者（房さん）との対談1〜3（ミャンマー投資・投資の基本姿勢）
・ミャンマーは物価が日本の50分の1、南アジアの若年層が消費を牽引する成長市場として注目。個人がアクセスする方法：FMI（ミャンマー人しか買えない）にリンクするシンガポール上場のヨマ・ストラテジックへの投資。
・投資感覚の鍛え方：最悪なくなってもいい金額で少額から始める、株式は「60%勝つ」を目標にする、個別株を見るとインデックスも理解できるようになる。証券アナリストは自分で投資しないため安定して勝てない（猿のダーツ投げと大差ない研究）。
・ウォーレン・バフェット流：自分が理解できるものにしか投資しない、能力を広げるより研ぎ澄ます。バリュー投資は純資産価格（PBR）が1を下回るものが狙い目。

■ M&Aと心理学の観点からビジネスを成功させる方法（電通対談）
・AIに代替されない仕事＝オリジナリティを発揮する仕事。インディペンデントシンキング（既知の考えを批判的に検討）とオリジナルシンキングが重要。
・カルキュレイテッドリスク（計算されたリスク）を取ることが重要。同業以外の副業は推奨。交渉は心理戦（口元のリラックス/緊張でYES/NOを読む）。
・運動30分後に認知能力が最大化。オメガ3摂取後30〜40分で認知能力UP。夢や志は「決めるもの」であり、信じ切れるかが鍵。習慣化には66日必要。

■ 房総理が語るお金と投資の授業＆ブルーオーシャンの見つけ方
・ブルーオーシャン投資＝ハイテクとローテク（養殖業など）の組み合わせ。タンパク質不足・水不足を見据えた投資に注目。「みんなが考えることのさらに次を考える」が鍵。
・30年スパンの超長期投資、逆転の発想（カジノで賭けるよりカジノの株を買う）。バブルのある国が世界制覇するという説（ITバブル期の資金調達で純資産価値が向上する仕組み）。
・遊び心とオリジナリティが企業の創造性を左右する（東池袋52の事例）。「答えより質問力が100倍重要」（アインシュタイン）。

■ 【ショート】バフェットの投資以外にも役立つ教えTOP5
①決して損をしないこと（ルール1を忘れない）②コミュニケーションスキルへの投資（自分の価値を50%高める）③付き合う5人の平均に人生は進む④リスクとは「無自覚の産物」（知識があればチャンスに変わる）⑤昨日より少し賢くなって寝る（毎日500ページ読む、仕事の80%は読書と思考）。`},
{title:"恋愛", status:"done", body:`■ メンタリストの心理学的モテトレーニング
・短期的にモテる「憧れられる人」と長期的にモテる「共感される人」は別。持ち物ではなくそれを選んだセンスを褒める。例え上手だと頭が良さそうに見えてモテる。男性はリスキーなスポーツがモテる。マインドフルな男（瞑想習慣）はモテる。

■ 脈アリ見抜く！モテる人の恋愛科学
・「理想の相手」を選んでいる人はほぼいない（98%は理想を簡単に変える＝妥協できるかが脈の有無を決める）。
・短期の恋愛はルックス・直観で選び、長期の恋愛は性格・理性で選ぶ（最初は直観、後から理想と照らし合わせる）。3ヶ月以上を長期の恋愛と呼び、友人関係から発展しやすい。
・脈ありの条件（サム・ソナーズ）：物理的な距離が近い、接触回数が多い、何かしてもらうと好きになる、一緒に乗り越える障害がある、類似性がある。
・不確実性（思わせぶり）が最も魅力を高める。相手が自分を好きか分からない時が最も魅力的に見える。

■ 外見褒めはNG！モテる人の会話とは
・会う目的は「次も会うこと」。相手に質問（傾聴）すると1.5倍また会える。15分の会話で9回以上質問すると良い。フォローアップクエスチョンを驚きの表情でする。
・親密度が高まる5つのテクニック：①徐々に深い内容に入る②お互いに話す③個人的な話をする④自己開示する⑤ボディータッチ（腕の外側など）。
・第三者を褒めると褒めた人自身の印象が上がる。恋愛初期に外見を褒めるのはNG（性格を分かっていないのに褒められても嬉しくない、関係が安定してから褒める）。共感している陰口は親密度を33%上げる。

■ エロテクよりも口説きテク（恋愛色彩心理学）
・似ている人を好きになる（類似点で始まり相違点で深まる）。行動は類似的、性格は相補的が良い相性。
・美人は損な面もある（母親能力が低く見られる、積極性が低く見える等）。美人には性格・能力を褒めるのが効果的。
・嫉妬への反応：男性は関係修復しようとし、女性は諦めをつけるため相手の悪いところを探す。
・恋愛が長続きするカップルは「やや得感」がある関係。脈ありの見分け方：用のない連絡が来るかどうか。
・魅力あるパターン（男性）：静か・クール・自制心・知的／清潔・スマート／情熱的・エネルギッシュ／社交的・明るい／真面目・優しい。（女性）：洗練・神秘的・知的／セクシー・積極的／初々しい・清楚／活動的・明るい／誠実・自制心／あっさり・聞き上手。`},

{title:"超解説力", status:"done", body:`■ 解説の8つの極意（オックスフォード式）
①実践的な例を使う（相手に関連する体験と結びつける）②個人的な経験の共有（ストーリーテリングは記憶に残る、ネガティブな経験の開示は信頼を得やすい）③定義の提供（曖昧な用語を明確に定義すると頭が良く見える）④アナロジーを使う（既知の概念と結びつけて理解を促す）⑤比較と対照を示す（似ているものと対比する）⑥語源参照（言葉の由来から説明）⑦前に学習・言及した情報へのリンク⑧視覚的な手段を提供する（図・表情・ジェスチャー）。

■ 【心に刺さる解説】レトリカルトライアングル
・SEE-Iメソッド：①State it（簡潔に説明）②Elaborate（自分の言葉で詳しく）③Exemplify（具体例と反例）④Illustrate（図示化）。
・レトリカルトライアングル（古代ギリシャ）：①エトス（信頼性の確立：自分が何者か、情報源、話す資格、話す理由を伝える）②パトス（相手の感情を揺さぶる：相手の期待・感情的つながりを考える）③ロゴス（論理と理性：論法・エビデンス・トーン・伝達手段・反論への備えを考える）。正論だけでは人は動かない、まずエトスとパトスで心を開かせてから論理を使う。

■ 【ハーバード式文章術】伝わる文章の書き方
・良い文章は「視覚的」で「会話的」。難しい言葉を使うほど頭が悪く見える。読み手は「自分と同じくらい頭がいい友人」だと思って書く。「知識の呪い」（自分の常識は他人の非常識）に注意し第三者に読んでもらう。結論から書く。徹底的に推敲する。
・逆ピラミッド法：①最重要情報を1〜2行に絞る②フロントロード（冒頭で最重要ポイントを示す、5W1Hの優先順位はWhat/Where→Who/When→How/Why）③サポート情報と詳細を追加④背景・ボーナス情報でまとめる。

■ 【天才の解説力】ファインマン・テクニック
・3パート：①子供に教えるつもりで短い文章に書く（想定年齢12歳）②レビュー（説明できなかった部分＝知識のギャップを見つける）③整理とシンプル化（専門用語をチェックし声に出してストーリー化）。
・セルフ・エクスプラネーション（独り言解説）：解説力が約2倍、テスト正答率が約3倍向上。8つの自問（何を知る必要があるか／情報はどこにあるか／解決済みか／パーツは揃っているか／次に何をするか／他の例はあるか／今の考え方でいいか／問題を言い換えると？）。
・サマライジング・トレーニング：①原著の一般的なアイデアを探す②メモを作る（重要でない部分を除く）③テンプレートで要約を作成（「この本の中で著者はこういうアイデアについて主張している」）。

■ 【例え話の極意】メタファートレーニング
・4ステップ：①テーマブレスト（お題から連想を20〜30個書き出す）②自由連想（さらに連想を広げる）③自由結合（「〇〇は△△のようなものだ」を作る）④表現化（1センテンスにまとめる）。
・パラフレージング（言い換え力）：①メモを読む②異なる用語を探す③自分の言葉に置き換える（受動態→能動態）④確認する。
・ラダーハック（抽象のハシゴ）：具体〜抽象の階段を意識して使い分ける。理解されていない時は具体化（ハシゴを降りる、Howで質問）、退屈されている時は抽象化（ハシゴを登る、Whyで質問）。
・マインドフルスピーキング：①スピードの意識②理由の意識③感情の意識、を持って話す。`},
{title:"リーダー", status:"done", body:`■ 人がついてくる7つの習慣【上に立つ者の科学】
・デザイン思考3つの基本：①部下の共感力を引き出す（顧客の感情を考える）②部下には曖昧さを推奨し自分には明確さを求める（解決策を一つに絞らない、締切より成果を優先）③トライアウト重視（複数のアイデアを即座にテストし失敗を推奨する）。
・優秀なCEOの4つの行動パターン：①決断が早く確信を持っている（IQが高いほど決断は遅くなりがち）②ステークホルダーを巻き込む（利害関係の相関図を書き反対者の懸念をプラスに変える、感情の伝染に注意する）③長期的視点に思考の50%を割く（普通のCEOは30%）④小さい実績を安定して上げ続ける（時間の50%で達成し残り50%を将来の展望に）。

■ 権力の階段の登り方【上に立つ者の科学】
・カリスマ性は鍛えられる。戦略性（長期思考）と戦術性（実行力）の両方が高い人が理想。IQ120がリーダーに丁度良い（130超えは「何を考えているか分からない」と思われる）。
・女性リーダーは17の能力（イニシアティブ・レジリエンス・誠実さ・他者の育成・大胆さなど）で男性より優れる傾向、男性が優位なのは専門知識と長期的戦略視点の2つのみ。
・社長業務の内訳：メール・事務25%／個人用事10%／出張8%／少人数打ち合わせ56%（一人でいる時間が多い）。
・リーダーには「マネージャータイプ」（現場主義）と「リーダータイプ」（仕組み作り優先）があり、大企業ではリーダータイプの方が利益率が20%高い。
・CEOスプリンター（就職後平均24年で社長になった人）の5つの特徴：①元々社長を目指していなかった②学歴は無関係③地道なキャリア④就職10年以内に大きな転機がある⑤必ず大きな困難にぶつかる（破産経験も30%）。

■ 社長になる人の働き方【上に立つ者の科学】
・優秀な社長は平日9.7時間労働、労働時間の79%を経営に使う。会議は週37回で労働時間の72%を占める（61%が対面）。
・リラックスタイムは平均2.1時間、SNSはやらない。1兆円企業社長の平均睡眠時間は6.9時間、運動時間は45分。
・良いリーダーを選ぶ3原則：①業績を上げるスキルとリーダースキルは別（過去の実績で選ばない）②好感度で選んでいないか確認する③会社のゴールに役立つ人を選ぶ（企業文化に合う人を選ばない）。
・社長の言葉遣いをチェックすると未来の業績が分かる（簡単な言葉を使う社長、楽観的に話す社長ほど株価が上がりやすい）。企業文化と逆のタイプの社長がバランスを取り成功しやすい（人重視企業には目標達成型社長が合う等）。`},
{title:"メンタルタフネス", status:"done", body:`■ メンタルタフネスを24時間で身につける〜前編
・レジリエンス（立ち直る力）は先天的なものだけでなく後天的に鍛えられる（脳の神経系に持続的な変化が起きる）。
・7つのテクニック：
①エクスポージャー・リコンソリデーション（怖いことに段階的に慣らす。恐怖レベルを1〜10に分けて少しずつ挑む。記憶の再固定化＝「昔は怖かったが今は怖くない」という記憶に書き換える。睡眠の質を上げ、繰り返し学習し、複数の感覚を使うと定着しやすい）
②アクティブコーピング（問題を避けず自分から向き合うことで耐性がつく。対策を練って挑む。リフレーミングで困難を「試練」と捉える）
③コントローリングストレッサー（コントロールできないストレスは減らそうとせず、自分から向かうストレスに達成感を見出す。デヒドロエピアンドロステロンというホルモンが分泌され脳が成長し老化にも抗う）
④ストレス予防接種（軽いストレスに慣れておくと大きなストレスにも耐えられる。朝一番に一番辛いことをやる）
⑤レム睡眠の時間を延ばす（ナイトルーティンを作る：睡眠スケジュールの一定化／リラクゼーション techniqueで寝る前15〜30分神経を鎮める／カフェイン・アルコールを控える／寝室環境を整える）
⑥運動（30分の早歩きでBDNF＝脳由来神経成長因子が分泌され、ストレスで潰れず成長できる体質になる。人と関わる知的な活動、魚を食べることも有効）
⑦食事制限（断食・カロリー制限で身体が「頑張ろうモード」になりBDNF増加、酸化ストレス・炎症・老化を抑える。2年間25%カロリー制限した研究では気分・睡眠・QOLが向上しネガティブな副作用はなかった）。`},
{title:"キャリア心理学", status:"done", body:`■ 【キャリアプラン】キャリア選びの極意
6つのポイント：①フローに入りやすい仕事（自由に決められる、開始終了が明確、タスクの種類が豊富、フィードバックがある）②人の役に立つこと（満足感に直結、消防士・看護師などが高満足度）③得意なことをやる（好きより得意、最終的にはスキルが興味に勝る）④協力的な同僚（職場に友達2〜3人でモチベーションUP、「不愉快なギバー」が最重要）⑤大きなマイナス要素がない（通勤1時間以上／長時間労働／不公平な賃金／不安定な仕事のいずれかがあれば転職を検討）⑥プライベートと適合する仕事。満足度は勤務先組織・上司・同僚・給料の公平性で決まる。

■ 【7つの習慣】キャリアを決める7つのトリガー習慣
・キャリア成功の46%は習慣（習慣・運・才能のうち最重要）。①ノーと言う前にイエスと考える②コンフォートゾーンの外で成長する③成長機会にオープンでいる④自分の直感を信じる⑤110%ではなく80%の自信で行動する⑥好奇心を持つ（30代までが勝負）⑦夢とリサーチのための時間を確保する。
・トリガー習慣の作り方：If-Thenルール／定期的な見直し／場所依存トリガー。10〜20代で明確なキャリア目標・高い学習意欲・盛んな就職活動を持つ人が30代以降成功しやすい（学歴とは無相関）。収入は25〜35歳で決まる（上位1%は230%増ではなく1450%増）。

■ 【キャリア不安】仕事の不安を乗り越える方法
・慢性的なキャリア不安は①感情の安定性低下②協調性低下③誠実性低下を引き起こす。
・キャリア不安に強い人の特徴：スキル開発・ネットワーク作り・キャリア計画・トレーニングに積極的（＝コントロール感が不安を減らす）。
・やってはいけないこと：❶大きな目標を立てる（チャレンジ目標の成功率は10%、業績が悪い企業ほど大きな目標を立てがち）❷2つのバイアスを避ける（「成功は努力から生まれる」という思い込み＝環境要因を無視、「社会的評価が低い仕事は恥ずかしい」という適合性バイアス）。
・正しい目標設定の5条件：自分との関連が薄い／さほど重要でない／抽象的すぎない具体性／矛盾しない／お金が最終目標でない。仕事の満足度を高めるのは安定性・自律性・ワークライフバランス。

■ 就職と転職：成功を決める7つの力
①教育レベル（若いうちの転職に影響）②メタ認知とポジティブ感情（メタ認知は初期選考、ポジティブ感情は最終選考に有利）③インパクトの強い活動（留学・インターン・研究等）④チーム活動経験（ソフトスキルが身につく）⑤専門職経験（経験豊富な男性に12%有利、女性にはメリットなし）⑥職場環境（学歴が有利なのは初期段階のみ）⑦就職成功率を高める6能力（積極性5.88倍／目標設定4.67倍／ソーシャルサポート4.27倍／自己効力感3.25倍／自己表現力3.40倍／仕事探しスキル3.32倍、プログラム参加で就職率2.67倍）。ギグエコノミー職（デリバリー等）は孤立感が2倍になりやすく避けた方が良い。

■ 【ネットワークブローカー】仕事の成果を決める人脈の作り方
・ネットワーキングの3変数：①ネットワークの中心性（広さ）②ジェンダーホモフィリー（同性間のやり取り）③コミュニケーションの平等性。女性は女性同士の繋がりで就職率2.5倍。男性は人脈の広さがそのまま地位に直結。
・ネットワークブローカー（複数コミュニティをつなぐ人）の3利点：幅広さ・タイミング・翻訳能力。キャリア成功の50%はネットワークブローカーであるかどうかで決まる。メンターを持つと内発的動機が向上する。

■ 【稼げる恋愛】仕事が成功するパートナーの条件
・成功者の配偶者は誠実性が高い傾向（ワシントン大学）。誠実性は感染する。パートナー選びは「神経症的傾向が低い」人を。目先の欲望を我慢できる人（遅延割引率が低い人）を選ぶと人生の失敗が減る。
・ビューティー・プレミアム仮説：外見が良いと収入が高い傾向があるが、それは性格の良さと結びついているため。高収入に繋がる性格特性：健康的・知的・誠実性が高い・外向的・神経質でない。`},
{title:"マインドセット", status:"done", body:`■ 努力がクセになる性格に変わる「成長マインドセット」入門
・硬直マインドセット（才能は生まれつき決まっている）vs 成長マインドセット（努力と意思で人生を変えられる）。ニューロプラスティシティ（神経可塑性）で脳は何歳でも変わる。親が子供の人生に与える影響は6〜10%程度。
・5つのテクニック：①才能より努力に目を向ける（能力を褒めるとチャレンジしなくなる、努力・戦略・選択を褒める）②結果と努力を正しく結びつけて分析する③正しい選択と効果のある戦略を見極める（努力が全て報われるわけではないと理解する、1万時間練習しても天才にはなれない）④ラクして成果を出す「正しい努力」を見極める⑤工夫した数をカウントする（工夫の回数＝思考回数、進んでいる感覚がモチベーションを保つ）。

■ 【ビルゲイツが認めた】成長マインドセットの身につけ方
・成長マインドセットのメリット：へこたれない・諦めない・セルフコントロール向上・楽観性・感情の安定。
・身につけるランキング：第3位 脳の可塑性を学ぶ（脳は何歳でも変わると知る）／第2位 他人を正しく妬む（悪性の妬み＝敵意 vs 良性の妬み＝憧れに近い苦痛。「もう」を「まだ」に変える、嫉妬した自分を責めない）／第1位 正しいロールモデルを選ぶ（困難を努力で乗り越えた人を思い浮かべると目標達成率が上がる。架空の人物でも良い）。`},
{title:"影響力", status:"done", body:`■ 「影響力の武器」のメンタリスト的な使い方（CLRASSの原理）
6つの武器：C一貫性（小さいお願いにYESさせてから大きい依頼をする＝フットインザドア、成功率約4倍）／L好意（自然な好意を乗せる、意図が見え見えだと効果なし）／R返報性（先に与えた方が約5倍になって返ってくる、敵意の返報性もある）／A権威（出典やお墨付き、良い服装や身長を高く見せる）／S社会的証明（皆がやっているから正しいと感じる、ウェルテル効果）／S希少性（数が少ないと欲しくなる、期間・数量限定）。組み合わせて使うと効果が強くなる。

■ 300を超える研究で判明！大衆を操る20のポイント（前編）
1議論の回数は多い方が良い（表現を変えて3〜5回）2関係性の必要さ（自分に関係あると思わせる）3普遍的なゴール（所属・正確さ・ポジティブな自己概念の3つのユニバーサルゴール）4お世辞・好意5権威6魅力（健康的な見た目）7メッセージの難易度を調整する8前置きをしない（自分目線の前置きはNG）9議論の展開スピード（共感時はゆっくり、反発時は早口で反論の隙を与えない）10反復（3〜4回で嘘も真実に感じる）。

■ 300を超える研究で判明！大衆を操る20のポイント（後編）
11社会的証明を入り口で使う12注意のコントロール（相手の集中がある時に伝える）13気を逸らすものを減らす14ポジティブを強調する（ネガティブで引き寄せてポジティブで着地）15意図の偽装（BYAF＝But You Are Free で相手に選ばせると説得率2倍）16心理的テーラード（相手の論理型/感情型に合わせる）17自信を持って伝える18幸福感・笑い（よく笑う人は影響を受けやすい）19力強さを感じさせる20伝統的な考えに直接反論しない（「今のままで満足ですか？」と問いかける）。プラスアルファ：同情を入れると論理的な話の2倍の説得力になる。

■ 恐怖と欲望の説得術：歴史を動かした偉人の話し方（前編）
・シュムージング（本題前の雑談）で寄付確率が20%上がる。話し出しの最初の3語は声のトーンを落とすと説得力が5〜8%上がる。早口は反対意見の場合、ゆっくりは賛成意見の場合に使う。類似点（生まれ月・血液型など小さなものでOK）を先に見つけると頼み事の成功率が43%→77%に。
・正しい自慢の4ポイント：①相手が集中していない時に言う②第三者に言ってもらう③過去の自分とだけ比較する④誰かに褒めてもらうよう頼む。
・頭が良く見える話し方：相手の目を見る、姿勢を正す、相槌とジェスチャーを使う、楽しそうに話す、聞き取りやすい声。難しい言葉を使うと逆に馬鹿に見える。

■ 恐怖と欲望の説得術：歴史を動かした偉人の話し方（後編）
・ロスフレーム（失う恐怖を強調、個人向け説得に）とゲインフレーム（得るものを強調、拡散・広める場合に）を使い分ける。
・スリーパー効果：最初のインパクトの大きさ＋後から情報源の権威性が明らかになることで、半年〜1年後にじわじわ効く（広告より効果的）。
・説得力を上げる5つのトレーニング：①落ち着こうとしない（緊張していい）②一人で練習しない（少人数でも人前で）③部屋を暗くする④ホットリーディング（聞き手を事前に調べる）⑤クイズ・質問・物語で冒頭の注意を引く。
・FTR法（Fear Then Relief）：恐怖を与えてから解放するタイミングでお願いを通す。Why Not戦略（説得成功率50%、他の手法より高い：断られた理由を聞き返し矛盾を突く）。`},
{title:"創造性", status:"done", body:`■ Think Different#1〜世界遊び
・創造性は現代で最も求められるスキル（LinkedIn、Adobe、世界経済フォーラムが指摘）。誰にでも備わっているスキルで、既存のアイデアの新しい組み合わせを作る能力。
・「5歳に戻る」：5歳児の98%が高い創造性を発揮するが10歳で30%、15歳で12%、30歳で2%まで低下する（正解を一つ求める教育のせい）。答えより道筋を大事にし、複数の考え方を持つ。
・創造性は危機によって育つ（ルネサンスは黒死病の後に起きた）。創造性は行動からしか生まれない（ピカソは絵画13万点以上を制作、アイデアは単なる出発点）。
・「ワールドビルディング（世界遊び）」：子供の頃の空想の国作りのような創造的訓練を大人になっても続けると創造性が高い（創造性の高い学生は2倍の世界遊びをしていた研究）。5ステップ：①アイデアの発掘（好きな作品の設定を分析）②世界の基本構造を設定（地理・文化・歴史）③世界の詳細を構築（社会構造・プロットライン）④世界の体験と検証（キャラ視点で日記を書く）⑤実践の継続（月1回見直す）。

■ Think Different#2〜夢想＆孤独ブースト
・夢想ブースト：うとうとした状態でアイデアを得る（画家ダリの手法）。夢想は未来志向、分析は過去志向。5つの方法：①インバース・ロールプレイング（別人格になりきって日常を過ごす）②無秩序メディテーション（あえて散らかった環境で瞑想する）③逆思考日記（一日を逆順に書く）④ランダムオブジェクト・ストーリーテリング（身近な物から即興で物語を作る）⑤クリエイティブウォーク（目的地を決めずに散歩する）。
・孤独ブースト：インスピレーションは人との交流から得るが、形にするのは一人の内省の時間。6つの方法：①ソロチャレンジ（ソロリトリート・ハイキング・アートセッション・デジタルデトックス・ライティング）②ミュートチャレンジ（1〜3日言葉を使わずに過ごす）③ソロミニマリズムDAY（最小限の持ち物で過ごす）④内省ドキュメンタリー撮影⑤感覚遮断内省（アイマスクと耳栓で外部刺激を遮断）⑥ランダム旅セッション（計画を立てずに旅に出る）。

■ Think Different#3〜非類似性ブースト&希望療法
①非類似性ブースト：自分と異なる視点の人と交流し「違っても良い」と思う。逆発想ゲーム（あえて失敗する方法を考えてから逆転する）、ランダムな本の利用（無関係な言葉から発想する）、異文化シミュレーション、夢の記録と分析。
②希望療法：楽観主義や自己肯定感より効果的で、希望があると失敗を恐れず試行回数が増え成功確率が上がる。ビジョンボード（目標を視覚化するが、非現実的すぎるポジティブさは逆に達成率を下げる）、希望の音楽プレイリスト、ポジティブなフィクション作品（逆境を乗り越えるストーリー）、逆境日記（毎晩、今日の困難と対処法・教訓を記録し週末に振り返る）。`},
{title:"社会的感情", status:"done", body:`■ 誘惑の科学〜なぜ集中力は続かないのか
・遅延割引（時間割引）：将来の報酬を小さく見積もる傾向。平均年次割引係数0.17（約6倍の報酬すら手放す）。年収を左右する8要素の中で遅延割引だけが唯一コントロール可能。
・幼少期の経済的困窮は遅延割引を高める（現在の状況とは無関係に影響）。92%の人は監視がなければ誘惑（不正）に負ける。理性は不公平な判断（偽善）をし、感情の方が公平な判断をする（認知負荷をかけると人は他人と同じ基準で自分も非難する）。
・自制心が強すぎると失敗で2.2倍幸福度が下がる、グリットが強い人ほど間違った戦略に固執しやすい。自制のしすぎは学習低下・燃え尽きにつながる。
・自制心に頼らない方法＝社会的感情（感謝・思いやり・誇り）。短期的感情（欲望・寂しさ・怒り）ではなく長期的感情を使うと自然に自己コントロールできる。

■ 感謝のチカラ〜努力最小で人生を好転させる感情の科学
・感謝には25の効果：行動変化／短期報酬回避／利他的行動が30%UP／思い出すだけで遅延割引率改善／人間関係改善／落ち込みと嫉妬が減る／成績・業績UP／浪費改善／物欲減少／健康改善／判断精度UP／ストレス改善／ギバー化／幸福度大幅UP／運動量UP／睡眠改善／自信とカリスマ性UP／職場改善／鬱対策／コレステロール改善など。
・感謝を高めるワーク：①秒速感謝ワーク（アラームで3つの感謝）②15分の感謝ワーク（6週間で幸福度+20%が半年持続）③週1回の感謝日記（週1が週3より効果的、半年続けると鬱にも効く）④Reciprocity Ring（互恵の輪）。

■ 思いやりのチカラ〜自分に優しくなれば未来は変わる
・未来の自分への思いやりで遅延割引が改善し貯蓄率が2倍に。自分への思いやりが低いと先延ばしが増え成績が下がる。
・他人への思いやりも効果的：迷走神経UP、ストレス減、幸福感UP。Googleの調査でチーム成績を左右する第1位は「支援と思いやり」（専門知識は最下位）。
・攻撃性のI3理論（引き金因・促進因・抑制因）。無駄な復讐は思いやりを失わせる。瞑想の真の目的は思いやりを鍛えること（8週間の瞑想プログラムで思いやりが3倍、困っている人に席を譲る率が16%→50%に）。
・思いやりを鍛える方法：慈悲の瞑想、類似性を感じる、拡張された自分で判断力を上げる（未来の自分への手紙）、コンパッションゴール（他己目標の方が鬱・不安が減る）、コンフォートカード、名言を作る、インターベンションブレスレット、セルコンフレーズ、コンフォートジェスチャー、コンパッション日記。

■ 誇りのチカラ〜成長を持続させる社会的感情
・誇り（自制・忍耐・目標達成を高める）と傲慢（衝動性・外的報酬欲を高め不安や浮気率を上げる）は別物。傲慢はテストステロンを上げ、誇りはテストステロンを下げセロトニンを上げる。
・外発的動機（報酬）はモチベーションを半分に下げる。褒める時は能力ではなく努力を、些細なことは褒めすぎない。
・内発的動機の3柱（有能感・自律性・関係性）。誇りを意識すると忍耐力が40%UP。「誇り日記」で成長と夢を記録すると忍耐力が高まる。
・誇りのある人は姿勢（体を開く・胸を張る・顎を上げる）で能力が高く見え、チームで協力されやすい。報酬を社会的観点で見ると忍耐力が1.5倍に。
・孤独は自制心を下げ失敗リスクを上げる（長期孤独は喫煙と同等の死亡リスク）。感謝・思いやり・誇りの3感情は伝染し、AIに代替されない仕事の条件でもある。`},
{title:"学歴を超える", status:"done", body:`■ Deep Smart〜学歴を超える力#1
・学歴と人生の成功、仕事の成果は無関係（ロンドン大学の研究）。企業が求めるのは問題解決能力・チームワーク・コミュニケーションのソフトスキル。GAFAクラスの企業は「好奇心」を重視する。
・XQ（経験指数）という指標：学歴より多様な経験を評価する流れ。米国では大学教育を重要視する人の割合が71%→41%に低下。Apple・テスラなど大卒要件を緩和する企業も増加。
・大学は「好きなことを好きなだけ勉強できる猶予期間」として価値がある（学歴自体よりそこで何を学ぶかが重要）。キャリアの中で平均12回転職する時代、体験学習・拒絶経験も含めた多様な経験が適応力を養う。
・学歴を超えるカギ：①ソフトスキルに依存する（コミュ力など数値化できないスキル）②XQ（経験値）を高める（タイパ・コスパを無視してでも経験を増やす）③ディープスマート（長期の経験で培われる専門知識・直感）を鍛える。
・ディープスマートが身につきにくい3つの理由：①暗黙知であること（模倣と試行錯誤で盗むように学ぶしかない）②持っている人が少ない③急速な業界変化に経験が追いつかない。

■ Deep Smart〜学歴を超える力#2
・Deep Smartを鍛える「OPPTYプロセス」（米軍でも採用）：①観察 Observation（エキスパートを観察し自分なりに仮説を立てる、単純模倣ではない）②実践 Practice（試行錯誤し仮説を検証、フィードバックを得る）③連携と協力による問題解決 Partnering（エキスパートやAIのフィードバックを取り入れ行動計画を立てる）④権限負担 Taking responsibility（支援を受けつつ自分で責任を持って取り組む）。
・6週間のロードマップ：1週目エキスパートを特定→2週目自己分析とギャップ分析→3週目自己研鑽と実践→4週目エキスパートにアプローチ→5週目エキスパートの観察とフィードバック→6週目実践と経験の積み重ね。`},

{title:"貯金術", status:"done", body:`■ 貯金の全技術〜無駄遣いを防いでひと財産を作る方法
・お金が貯まらない3つの理由：①情報の管理ができていない②資産の分散化③予算の誤謬。
・ノスタルジー戦略：①昔の写真や懐かしい物を見る②ポジティブ感情に名前をつける③共通点を見つける、と貯金が増える。感謝日記をつける、巡環型思考（今日の積み重ねと捉える）も有効。

■ 勝手にお金が貯まる11の心理習慣
①頭の良し悪しは無関係（年収6万ユーロ超えるとIQとの相関がほぼ消える）②程々社交的に生きる（10〜20%だけ利己性を抑える、中程度に反社会的な人が最も高収入）③他人を信じる（皮肉屋（シニシズム）レベルが高いほど所得が低い傾向）④有能感を感じる行動をする（力を感じると維持しようとしてお金も貯まる）⑤欲を分散する（欲が強い人は収入は高いが幸福度は低い、欲望を他者にもシェアできる形にすると良い）⑥将来の重要度を5段階で採点してから買う⑦自分の将来像を頻繁に考える（未来志向だと衝動性が低い）⑧テストステロンを高める（給料が高い人はテストステロンが高い傾向）⑨自分の性格に合った仕事を選ぶ（性格と仕事の一致で収入UP）⑩学んだ上で6倍のリスクを取る（純資産6億円以上の富裕層は42%の確率でリスクを取れるが低所得層は7%）⑪内受容感覚を鍛える（自分の心拍を正確に感じ取れるトレーダーほど稼げる）⑫体型と収入の関連（男性は身長が高いほど、女性は痩せているほど世帯収入が高い傾向）。

■ 金融心理学に学ぶ【ムダ金のなくし方】
・無駄金＝使っても大した喜びにならないお金。8つのテクニック：
①価値観の明確化（1日の中で最高の15分は何か自問する）
②お葬式エクササイズ（自分の葬式を想像し何を大切にしていた人だったかを考える）
③インタビューエクササイズ（15〜20年後に成功しインタビューされている姿を想像する）
④価値のエクスプレッシブライティング（15分×最低4日間、お金への信念を書き出す筆記開示）
⑤付箋を使う（価値観をイラストや名言にして買い物時に見える場所に貼る）
⑥何のために節約するのかを明確にする（過度な節約は浪費と同じくらいダメージがある）
⑦10億円エクササイズ（宝くじで10億当たったら最初に買う物15個を書き出し、その欲望の出処を分析する。作業後、本当に欲しいものは3つ以下になる）
⑧長期目標に役立たない・見栄のための出費を排除する（他人に見せるためのブランド品への出費など）。
・「究極の1」（本当に良い1着など）を持つ方が満足度が高い。無駄金をなくすとストレスが大きく減る。`},
{title:"親切心", status:"done", body:`■ 人心掌握のための親切とプレゼントの心理学〜トップギバーになるには
・3タイプ：ギバー（与えることでネットワークを作る）／マッチャー（バランスを取るために与える）／テイカー（手に入れるために与える）。
・ギバーには「ボトムギバー」（自己犠牲型で経済的・影響力が最下層になりやすい）と「トップギバー」（みんなの利益を最大化する中に自分も含める）がいる。自己犠牲のギバーではなく価値を生み出すギバーを目指す（誰にでも与えるのではなく長期投資する）。
・テイカーが好むもの：お金・富・権力・快楽・勝利。ギバーが好むもの：援助・信頼されること・社会貢献・情にもろい。
・ギバーの4つの力：①緩いつながりを上手に使う②利益のパイを増やす（独り占めではなくみんなで）③他人の中の可能性を見つけて育てる（ピグマリオン効果）④リーダーシップより影響力作りを大事にする。
・テイカーは自分の話が好き。お金以外のギブとして「聞くこと」「つなげること（リコネクト能力）」がある。`},
{title:"印象操作", status:"done", body:`■ ブランディングについて語ってみた
・ブランディングは新しく作るものではなく「自分が元々持っている才能をどう見せるか」。孤独を貫き周りの意見を全て取り入れないことで才能を守る。限定的ブルーオーシャン・参入障壁が高いものを選び、自分なりの新しい解釈を加える。PR3段階：①話題性を作る②認知度を高める③リブランディング（集めた認知度を本当にやりたいことに移す）。アイデアを作る5つの習慣：場所を変える／メモ癖／低GI食品を食べる／物を捨てる／ひたすら読む。

■ 第一印象診断〜初対面から得する人の共通点
・カリスマ性は後天的に鍛えられる（知性とは無相関）。特徴：他人を快適にする、時々笑いかける、誰とでもうまくやる、存在感がある、影響力がある、集団を導ける。
・カリスマ性を高める6能力：共感能力・傾聴スキル・アイコンタクトでシンクロ・情熱を向ける・一貫した自信・未来を語る表現力。トレーニング：表情で感情を大げさに伝える／要約して確認する／無音映像で感情を推測する練習／ストーリーで語る／レトリカルクエスチョン（極端な2択で相手に決断させる）／高いゴール設定をしつつスモールゴールも示す／具体性の高い言葉で説明する。

■ カリスマ性がある人の話題選び
・相手が知っていることを話すのが基本（説明力があれば新しい話題でも楽しませられる）。「自分とは違う世界にいる」と思わせる神秘的なストーリーがカリスマ性を生む（努力より神秘性）。幸せそうな動きをするだけで人を惹きつける。

■ 悪い印象を事前に防ぐ「心理的保険」のかけ方
・理想的な握手：片手・アイコンタクト・笑顔・2〜3秒・乾いた手（両手握手はNG）。ゆったりした歩き方が説得力を上げる。好感度は程々の方がカリスマ性が高い。カリスマ性＝人を集める能力と個人の能力のバランス、暖かみと有能さで第一印象が決まる。

■ 感情操作の技術〜メンタリストが早口な理由
・毒舌（軽い罵倒）はスピーチの最初と最後に入れると最も評価が高い研究。怒りを表現できる候補者は得票率が上がる。不自然な感情表現は交渉成功率を2倍にする（人は不安を感じると動きやすい）。まとめ：①早口でまくしたてる②最初と最後に感情表現を入れる③交渉時にあえて不自然な感情表現をする（その後自然な表現に戻すと仲良くなれる）。

■ 嫌味にならない！気づかれずに自分の印象をよくする方法
・FBIの交渉術5段階：①傾聴②共感③ラポール（信頼関係）④影響⑤交渉。多くの人はいきなり説得から入ってしまう。
・傾聴の4基本：口出し・反論・評価をしない／短く定期的に頷く／まとめる／手短な質問。上級テクニック5つ：①オープンクエスチョン②わざと間を作る③短い相槌④相手の最後のフレーズを繰り返す⑤感情に言葉をつける（最も強力）。
・自慢の4ルール（ミシガン大学30年研究）：①相手の集中力がない時に自慢する②自分から切り出さず先に相手を褒める③過去の自分とだけ比較する④友達や同僚に褒めてもらう。

■ 【ステレオタイプ利用法】最も手っ取り早く印象を操作する方法
・パッと見の印象は髪型・顔立ち・体型・身体の動きで決まる（内面は見られていない）。
・髪型の印象（女性）：ショート＝自信・社交的／ストレート金髪＝セクシー・お金持ち・心が狭い／ミディアム黒髪＝人が良く知的／ロング黒髪＝特徴なし。（男性）：ショート＝セクシー・自信・自己中心的／ミディアム横分け＝お金持ち・頭が良い・心が狭い／ロング＝人が良い・注意力低い。
・体型：太っている＝だらしない、スリム＝自信・情熱、幼児体型＝信頼しやすい・温かみ。
・印象の良い顔：童顔・馴染みがある顔・健康的な肌・感情が似ている顔。頭が良く見える行動：目を見る・姿勢を正す・メガネ（フレームレスが最強）・ジェスチャーと相槌・楽しそうな声。有能に見える話し方は「実績ではなく努力のストーリーを語る」こと。変人キャラも頭が良く見える効果がある（レッドスニーカー効果：スーツよりTシャツの方が頭が良く見える現象）。`},
{title:"テストステロン", status:"done", body:`■ テストステロン欠乏の恐怖〜知らなきゃ人生を棒に振る
・現代人はテストステロンが20年前より25%低下（座りっぱなし・運動不足・ストレスが原因）、40代の2割が不足、95%は自覚していない。
・不足で起きる12症状：行動力激減／慢性疲労／肥満／病気になりやすい／うつ病リスク／焦燥感／持久力低下／ポジティブ感情低下／ネガティブ感情増加／身長縮小・筋力低下／早寝と中途覚醒／女性でも同様の異常。
・女性は低脂肪食NG（1日30gの脂質必須）。テストステロン過多は不妊やPCOS・薄毛の原因にも（運動後60分以内にタンパク質：炭水化物＝1:3で食事すると防げる）。
・テストステロンが低くエストロゲンが高いとコロナ重症化しやすい研究。男性は高いほど世帯収入が高く健康、女性は逆の傾向。裕福な幼少期を過ごすとテストステロンが高くなりやすい。決断が速くなる（合理的でも不合理でもモテる）、髭のある男性が長期的関係の相手として魅力的に見える、声が低い人は浮気率が高い傾向。

■ 【爆発的行動力】テストステロンを高める7つの戦略
①体脂肪を男8〜15%・女15〜22%に（プチ断食も有効）②3大栄養素の黄金比（脂質40%・タンパク質20〜25%・炭水化物、タンパク質は体重1kgあたり1.6gが最大）③睡眠の質と時間を増やす（4時間睡眠でテストステロン半減、1時間増えるごとに15%UP）④週2〜3回の筋トレで1.4倍UP（HIITも有効、45分以上の長時間トレーニングは逆効果）⑤勝利体験でテストステロン爆増（勝ったと「思う」だけでも上がる、負けても基本的に損はしない）⑥競争とリスクに身を置く（スカイダイビングや薪割りでもUP）⑦テストステロン補充療法（塗り薬・注射が有効、飲み薬は意味なし）。

■ 【やる気が出ないはこれが原因】テストステロン減る行動
・減らす行動TOP5：①高糖質食（1日67gの精製糖でメンタル破壊）②添加物コスメ（パラベン等）③頻繁な間食④寝る前の糖質⑤低脂肪食（1日小さじ1のココナッツオイル等の飽和脂肪酸が必須）。
・カロリー制限しすぎ（40%以上はNG）、糖質制限しすぎ（同カロリーでも36%減）も逆効果。減らす食品10選：大豆製品・ペパーミント・甘草・亜麻仁油・植物性油脂（キャノーラ油等）・加工食品（トランス脂肪酸）・酒・ナッツの摂りすぎ・霊芝・緑茶の飲みすぎ。`},
{title:"人脈", status:"done", body:`■ 仕事のモチベーションを700%アップする！友人と人脈の科学
・職場に3人以上の友人がいると人生の幸福度が96%（約2倍）、給料の満足度が200%（約3倍）上がる（ギャロップ社2004年、500万人調査）。最高の友人が職場にいると仕事のモチベーションが700%UP。社内に友人がいなければ転職も検討すべき。
・給料が上がりやすい人の順位：①社外ネットワークを維持する人②社内ネットワークを新しく作る人③社内ネットワークを維持する人。チャンスは「弱い紐帯」からもたらされる。セルフコントロール能力が高い人と付き合うと自分も高まる。

■ たった9ヶ月で出世するボストン大学式の人脈術
・4万人の新社会人調査：出世が早い人（9ヶ月）と遅い人（4年）の違いはネットワーキング力。自己ブランディング（自分を積極的に宣伝すること）はほぼ無駄。「聴く」方がコミュ力が高く見える。
・褒めてもらうには先に人を褒める。アドバイスシーキングで成約率が8%→42%に。世間話の延長で「最近いかがお過ごしですか」「最近どのくらい幸せですか」と聞くだけで好感度が上がる。

■ コミュ障でもできる「5分間ネットワーキングトレーニング」
・コミュ障は最初の3回だけの問題で技術で克服可能。人の良い噂を流すと噂した本人の印象が良くなる。If-Thenプロファイルで一貫性を持つと信頼されやすい。関係維持は最低15日に1回の接触。トップギバーになる「5分ルール」（5分以内でできる親切はすぐやる）。

■ 少ない人間関係で最大の成果を出す「スーパーコネクター」の見つけ方
・新しい人脈よりも休止中の絆を「リコネクティング」する方が価値が高い。人脈のポートフォリオは①カジュアルコンタクト②インテリジェンスネットワーク③ストロングコンタクト④オンラインネットワークを均等に持つのが理想。

■ 主観的類似とアソビゴコロで一瞬で友達を作る技術
・親密になる鍵は「主観的類似」（客観的な共通点より、相手が似ていると主観的に感じること）。似ていると良い2要素：①人生への態度・信念②コミュニケーションスタイル。ストーリーテリングで相手に主観的類似を勝手に感じさせるのが効果的。
・「共同作業による笑い」（2人で一緒に何かやって笑った経験）が友人関係を深める。プレイフルネス（アソビゴコロ＝どんな状況でも楽しい部分を見つける能力）も重要。

■ 裏切られない人間関係を作る、正しい「自己開示」の作法
・自己開示＝プライベートな情報を脚色せず伝えること。テキストベースの会話（LINE等）は直接会うより自己開示が増え信頼構築に効果的（意見を整理できる、誤解が減る、情報量が少ない分丁寧に説明する、受け手も好意的に受け取る）。関係維持は最低15日に1回テキストで自己開示するのが目安。
・失敗しない自己開示の10テーマ：①お金や健康の心配事②イラッとした体験③人生で幸福なこと④改善したいこと⑤夢・目標・野望⑥性生活（爽やかに）⑦弱点やマイナス面⑧怒ってしまう出来事⑨趣味や興味⑩恥ずかしかった体験・罪悪感。弱さを見せる人ほど強く見える。

■ 人間関係をリセットする方法
・人間関係は選ぶもの。振り回される人と振り回されない人の違い、内向的な人の友人の作り方、捨てても良い人間関係の見極め方について。ペットを飼うと孤独感が減る。8週間ワーク（1日再構成法で人間関係を予定から整理する）で本当に大切な人間関係だけを残す方法を紹介。

■ 緊張しない準備〜人前で緊張せずに話せるようになる方法
・「落ち着こうとしない」（心臓のバクバクを「やる気に満ちている」と捉え直す）。1人だけで練習しない（少人数でも人前で練習する）。暗い部屋で話すとリラックスできる。オーディエンスについて事前に知っておくと緊張が和らぎ説得力が増す。クイズ・質問・物語で参加させる。無茶なお願いでも50%の確率でYESを引き出す「Why not戦略」。`},
{title:"money", status:"done", body:`■ マネースクリプト①：お金で損する体質を直す診断テスト
・マネースクリプト＝お金に対する思い込み・考え方（親の影響が大きい）。4分類：①金銭地位（お金＝地位）②金銭崇拝（お金があれば自由・幸せになれる）③金銭忌避（お金を嫌う）④金銭警戒（使うのを恐れる、貯めるべきという思考）。32問6点法のテストで自分の傾向を測定できる（各分類9〜48点でスコア化、点数が高いほどその傾向が強く注意）。

■ マネースクリプト②：金持ちへの道を阻む考え方TOP10
①お金があれば全て解決すると思う②お金は悪だという思い込み（嫌儲バイアス）③自分はお金持ちにふさわしくないと思う④お金はどんどん使わねばならないと思う（幼少期の困窮体験由来）⑤お金はいくらあっても足りないと思う（貧困育ちに多い）⑥お金が不足することはあり得ないと思う（資産家育ちに多い）⑦お金は重要ではないと思う⑧お金が人生に意味を与えると思う⑨お金について語るのは行儀が悪いと思う⑩善人ならお金に困らないと思う。

■ マネースクリプト③④：破産する人の11の特徴（親の育て方が原因）
①他人のためにお金を使いすぎる（たかり屋に注意）②他人に経済的に依存する③予算を超えた支出をする④あぶく銭を無駄遣いする⑤詐欺や悪い投資に引っかかりやすい⑥裕福さ回避（お金を稼ぐことを無意識に避ける）⑦病的なギャンブル⑧裕福反発（金持ちを攻撃する）⑨衝動買い⑩過少支出（必要な投資すらケチる）⑪ワーカーホリック（無理して働きすぎる）。それぞれに具体的なチェック項目あり。DaiGoが語るFIRE観：経済的安心か自信がないと難しく、時間を圧縮して働き自由な時間を作るのが本当のFIRE。

■ マネースクリプト⑤：富をもたらす5つのマネースクリプト
①万が一のために貯金は大切だが、お金持ちは貯金だけでなく投資に回す②貧しい人にお金を分け与えるべき（ギバーであること、ただし都合の良いギバーにならない）③お金は自由を買うためのツール④十分なお金があると実感するために一生懸命働くべき（主体的なハードワーク）⑤自分はお金に値する人間だと思う（自己効力感）。現代人の節約を邪魔する4つのトラップ：①周囲の価値判断基準に流される②支出カスケード（富裕層の生活が中間層〜一般層に伝播していく）③周囲の支出基準に合わせるコスト④地位財のための軍拡競争的支出。

■ マネースクリプト⑥：金持ち体質になる8つの書き換え法（前編）
・アメリカトップ2.5%の富裕層の6特徴：①知的好奇心が高い②統制の所在が内部にある（自分でコントロールしている感覚）③お金への警戒心が強い④ステータスへのモチベーションが強い⑤ハードワークを好みワークライフバランスは気にしない⑥お金は単なるツールと捉える。
・書き換えの第一歩は「両親からお金について最も影響を受けた教え」を書き出し、それが自分をどう傷つけているか分析すること。8つの書き換え法（i know i shouldリスト／マネーストーリー／ロス認識トレーニング／マネーグリーバンス／マネーマップ／マネーエンパワーメント／フィナンシャルメイクオーバー／マネーマントラ）のうち「i know i shouldリスト」を解説：12の自問リストを使い、特に「そのアクションを行わない場合の最悪のシナリオは？それに耐えられるか？」という質問が大きな決断に有効（DaiGo自身のテレビ引退の決断もこの質問で行った）。`},
{title:"他人と比較しない　セルフコンパッション", status:"done", body:`■ 前編：己を成長させるセルフコンパッション
・比較していいのは他人ではなく「過去の自分」。セルフコンパッション＝親友を応援するつもりで自分を応援すること。3要素：①自分への優しさ②一般的な人間性（悩みは皆同じ）③マインドフルネス。
・6つのトレーニング：①フレンドトレーニング（親友への慰めの言葉と自分への言葉のギャップに気づく）②人間性トレーニング（自分の悩みが皆に共通することを書き出す）③スージングタッチ（自分の体に優しく触れる）④コンパッションムーブ（立ったままのボディスキャン瞑想）⑤ストーンエクササイズ（石を観察し没頭してフロー状態に入る）⑥デイリーマインドフルネス（皿洗いなど日常動作に集中する、最も取り入れやすい）。

■ 後編：ハーバード大学式セルフコンパッション（史上最強の瞑想法）
①アイスエクササイズ（氷を握り、湧いた不快な感情に優しさを添えて受け止める）②抵抗アウェアネスウィーク（1週間、抵抗を感じた瞬間を記録しラベリングする）③グラウンディング（裸足で歩き足裏の感覚に集中する）④慈悲の瞑想（自分と他人の幸せを祈る瞑想、10〜15分×一定期間で15ヶ月効果が続く。簡易版：「私が幸せでありますように」等を唱える）⑤歩行慈悲瞑想（すれ違う人の幸せを願いながら歩く）⑥シェイムエクササイズ（恥の感情を身体感覚として意識し、セルフコンパッションで手当てする）⑦ニーズトレーニング（満たされない感情を自分で満たす方法を考え実践し採点する）。`},
{title:"名著シリーズ", status:"done", body:`■ 科学で読み解く孫子の兵法（第一弾：己を知り彼を知る）
・孫子の兵法を脳科学・心理学で読み解くシリーズ。「己を知り彼を知れば百戦危うからず」がテーマ。

【10のアクションプラン】
①自己認識の戦略：ダニング・クルーガー効果（能力が低い人ほど自己評価が過大）に注意。フィードバックループ（信頼できる人から匿名フィードバックをもらう）／セルフモニタリング／日記・週次レビューで自己認識を高める。
②相手の頭に潜入するテクニック：「兵は詭道なり」（戦いは騙し合い）＝人は本音と建前を使い分けている。パースペクティブ・テイキング（相手の立場に立つ）で交渉成功率が上がる。会話中の頭内実況、過去の自分を想定する、質問とリフレーズが実践法。
③怒りを抑える「10秒シールドメソッド」：怒りは扁桃体ハイジャックで5〜10秒でピークを迎え、その後10秒で前頭前野が理性を取り戻す。怒りを感じたら10秒数える、客観視すると心拍・血圧上昇や攻撃性が抑えられる。
④認知の罠（バイアス）攻略：ダニング・クルーガー効果・確証バイアス・バイアスブラインドスポットなどに誰もが陥る。「デビルズアドボケイト」役を立てる、反論チェックリストを作る、第三者視点を取り入れる。
⑤「戦わずして勝つ」交渉術：競争や衝突を避け、相手が自ら望む結果を受け入れるよう導く。感情を正確に読み取る能力が高いほど交渉後の共同利益が20〜30%増える研究。小さな譲歩から始める。
⑥感情読み取り能力（ERA）で人間関係を掌握：表情・声・仕草から本心を察知する能力。「感情を読みすぎている」と思っている人の9割以上は実は思い込み。読み取った感情を言葉でフィードバックすると精度が上がる。
⑦「戦う前に勝つ」脳科学的プランニング術：孫子「多算勝」＝準備の緻密さが勝敗を決める。If-Thenプランニングやプレモルタム法（事前に失敗をシミュレーションする）が有効。計画は具体的なストーリーとして描く。
⑧「水の如く動け」認知フレキシビリティ：状況に応じて柔軟に形を変える。ルーティンをあえて崩す、複数の代替案（プランB・C・D）を用意する練習が有効。
⑨奇策と定石：「正を以て合し、奇を以て勝つ」＝基本（定石）を固めた上で意外性のある一手（奇策）を混ぜる。安定策と革新策の両方を推進する「両利きの経営」が長期的に業績を高める。
⑩己を知り彼を知る：自己理解と他者理解の両方を持つリーダーが最も成果を上げる。まとめの格言：「己を知り彼を知るがなき者は戦う前から負け、己を知り彼を知るがある者は戦わずして勝つ」。`},
{title:"スキンケア・アルゴリズム", status:"done", body:`■ スキンケア・アルゴリズム〜永遠に20代に見える肌を手にする
・食事・睡眠・運動が肌の基本。14の神話を否定：高価なクリームは不要（シンプルな保湿＋レチノール＋日焼け止めが有効、肌老化の9割は光老化）／水を飲んでも直接肌は潤わない／顔の汚れ自体はニキビの原因でない／自然派製品が良いとは限らない／傷は乾燥より清潔で湿った環境が治りやすい／頻繁な角質除去はバリア機能を壊す／抗菌石鹸は耐性ができる／油っぽい食事はオイリー肌の直接原因ではない（ニキビの原因は体内の酸化）／日焼けは適度なら抗炎症作用がある／SPFは30以上なら効果はほぼ同じ。
・スキンケアの基本アルゴリズム：①1日1回のクレンジング＋保湿（シンデットクレンジングを推奨、アルカリ石鹸は避ける）②ニキビの原因食（清涼飲料水・乳製品・ファーストフード）を減らす③肌の早期老化6大原因（目を擦る／睡眠不足／ストロー使用／ストレス／サングラス忘れ／乾燥する石鹸）を避ける④トマト＋オリーブオイルで光老化対策⑤日焼け止めは厚めに塗る。

■ メイクの効果わずか2%〜本当のモテ顔の作り方
・男性は無意識に唇を見る（黄金比1:2）。メイクの全体的な魅力度への効果はわずか2%。フルメイクより30〜40%薄いナチュラルメイクの方が魅力的。モテる顔は「スパースネス」（情報量が少ない＝若く見える、肌トラブルが少ない）。太った体型のカバーは逆効果、知性的な会話と自信の方が体型より魅力的。

■ 【炎症対策】科学が見つけた唯一の若肌の作り方
・避けるべき食品：精製糖・乳製品・オメガ6脂肪酸の多い食品・ファーストフード。野菜とフルーツを1日350g、葉物野菜（ほうれん草・ケール・ブロッコリー）が特に効果的。定期的な水分補給も重要。

■ 【炎症対策】科学が認める最強のスキンケアフード13選
・お茶（白茶が最強）、トマト（リコピン）、ダークチョコレート（カカオ80%以上）、ケール、ザクロ、アボカド、シナモン、ブロッコリー（生で刻んで20〜30分置くと成分UP）、きのこ、オリーブオイル（1日8.4g）、魚（オメガ3）、リノール酸（ひまわりの種）が肌に良い食材。

■ 【生放送】至高のスキンケアTOP5
①保湿・日焼け止め（量を気にせず使う、化粧水は蒸発するため意味が薄い）②抗炎症系食品（カカオ・ブルーベリー・ビーツを毎日）③睡眠（1時間早く寝るだけで肌が変わる、メラトニン活用）④腸内環境対策（キャベツ・ブロッコリー・アボカド・きのこ・味噌）⑤HIIT運動。結論は「食事・睡眠・運動＋保湿」が最重要。

■ 【本当は怖いメイクの心理学】
・化粧品広告の82%は科学的根拠が怪しい研究。他人のすっぴんを見ると自分のコンプレックスが軽減しメンタルに良い。メイクに気を配る女性ほど恋愛が破局しやすい傾向、同性から嫉妬されやすい、信頼されにくい（進化的にリソースを食い荒らす存在と見なされる）、リーダーとしての評価が下がる研究。一方でメイクの濃さとカジュアルセックス頻度には相関がない。

■ 【印象操作メイク】狙い通りの印象を与えるメイクのポイント
・メイクは「若さの擬態」（顔の情報量を減らす効果）。年代によって効果が違う：40〜50代はメイクで若く見える、20代はむしろ老けて見えることも。全年代共通で30代女性が最も魅力的に見えるとする研究。
・5つのメイクアップ法：①ハイ/ローライト（明るさで年齢・性別の印象を操作）②アイブロウ（眉間を広げると女性的、狭めると男性的）③チーク（水平で幼顔、斜めで大人顔）④アイメイク（目頭で男性的、目尻で女性的）⑤リップ（唇の下にハイライトで女性的、上で男性的）。基本は自分の顔の系統（童顔／大人顔）を活かすメイクが最も評価が高い。`},
{title:"倒れない計画のつくり", status:"done", body:`■ 準備ですべてが決まる！科学的に正しい準備「MAC」前編・後編
・事前準備で達成率が決まる（準備をミスると達成率は10%程度）。MACの法則：①測定可能性（Measurable、数字で目標を決める）②行動可能性（Actionable、プロセスに落とし込む）③適格性（Competent、自分の価値観に合っているか）。
・疑問形セルフトーク5ステップ：①自分は本当にできるか？（現実的に問う）②なぜこれをしたいのか（C）③どのようにやるのか（A）④いつやるのか（M）⑤もっとうまくやるには？と問い続ける。
・心理対比4ステップ：①目標達成後のポジティブな未来を書き出す②一番気分が良くなるものを選ぶ③目標達成の障害を考える④一番大きな障害を細かくイメージする（WOOPと違い対策までは考えない、PLANが立てられない時に使う）。

■ 失敗する準備、成功する準備の見極め方
・パブリックコミットメント（人前で目標に結びつく行動をして説明する）はコミットメントを下げる場合がある（目標を言うことに満足してしまう）。複数目標は3個までが及第点、10個がデッドライン。「どうにでもなれ効果」は短期目標・禁止目標で起きやすく、長期目標・行動目標・失敗から立ち直った回数を数えることが対策になる。

■ 「科学的に正しい計画」の立て方
・ビジュアライゼーションは「結果」より「プロセス」をイメージする方が効果的。プランB（バックアッププラン）で手段を複数化しモチベーション維持。チートデイ（あらかじめ決めた日のみ）で脳を休ませる。不調時はタスクフォーカス、好調時はゴールフォーカス。ゴールから逆算する後方プランニングを推奨。性格に応じて防衛型／戦略型のプランニングを選ぶ。

■ 三日坊主を防ぐ「曖昧目標」のススメ
・正しい目標設定：影響力の小さな目標／重要度の低い目標（多少失敗しても傷が浅い）／ほどほどの具体性（融通が利く）／複数目標が矛盾しないこと／お金を基準にしない。未達成の目標は「修正」「軽量化」「再解釈」で立て直す。小さな勝利の積み重ねでモチベーション維持。

■ QOT〜時間の質の高め方
・QOT（Quality Of Time）＝楽しさ×有意義さで決まる。1日合計2時間の実践で幸福度が上がる。①30分以上の運動（朝が効果的）②屋外での活動③自分以外のための時間を作る④1日1回は人と関わる⑤職場に友人を作る（幸福度・熱意が2倍、モチベーション6〜7倍）⑥職場でユーモアを発揮する⑦週4で8時間睡眠優先日を作る⑧しなかった後悔よりした後悔を選ぶ⑨楽しいことの多様性を高める⑩週末をバカンスのように過ごす⑪ピークエンド効果を狙う⑫畏敬の念を感じる体験をする⑬憧れの年上に定期的に会い「一番の誇り・後悔」を聞く（ハーバード成人発達研究と同じ結論＝最重要な決断は「誰と時間を過ごすか」）⑭後悔の遺言エクササイズ／90代まで生きた自分の追悼文を書く。

■ 最高の1年の作りかた
・予定は近い将来ではなく年単位（12月）から逆算して立てる。「スクラッチカレンダー」（1〜12月を紙に書き俯瞰する）。5の倍数の年齢ごとに目標を設定。予定を入れる判断基準は「人生全体で見てこの予定は重要か」。
・8つの実践：①達成に時間がかかることから予定に入れる（逆優先ルール：やりたいこと→できたら良いなと思うこと→やるべきこと、の順で予定を先に埋める）②何かを乗り越える目標を立てる（苦しみを乗り越えると幸福度が上がる）③バカンスの予約を先にする④予定を区切る（1週間・10日単位でテーマを決める）⑤残りが少ないと感じさせると物事を大切にする（心理効果）⑥チートデーを計画する⑦「YESしまった効果」をチェックする（本当にやりたいことだけ選ぶ）⑧2週間ごとに感動したことと失望したことを特定し予定を調整する。`},
{title:"お金の勉強", status:"done", body:`■ ミリオネアの17の習慣（前編・後編）
・ミリオネアの17習慣：①ネガティブな人を避ける②熱心な読書家（88%、自己改善のための読書）③運動習慣（76%、毎日30分以上）④ボランティア習慣（72%）⑤理想の未来を書き出す（61%）⑥自分の目標追求に拘る⑦7時間以上の睡眠（89%）⑧早起き（50%）⑨複数の収入源（65%、最低3つ）⑩ネガティブに向き合うポジティブさ⑪メンターの存在⑫他人の成功を助ける（伸びる人と繋がる）⑬群れに従わない（コミュニティを自分で作る）⑭社会的マナーを守る⑮一人で考える時間を作る（毎朝15〜30分）⑯幅広いフィードバックを求める⑰諦めない（ミリオネアの25%は一度失敗を経験）。

■ 資産が億を超える人、超えない人の違い
・富裕層特有の性格TOP5：リスク許容度が高い／開放性が高い／外向性が高い／誠実性が高い／神経症的傾向が低い。弱点は後天的に補強可能。

■ 超富裕層の8つの習慣（資産3.5億超え）
①貯金好き（純収入の20%を貯金）②ギャンブルをしない③スクリーンタイムが少ない（TV・ネット1時間未満/日）④感情コントロールが上手い⑤月5時間以上のボランティア＋ネットワーク作り⑥決まった以上の仕事をする⑦有害な人を避ける⑧メンターを探す（93%が保有）。

■ 日本の富裕層の特徴（年収3000万〜6000万超）
・資産増加理由の中心は「コツコツ貯蓄」。時間は自己投資（勉強・健康維持）に使う。座右の銘は「努力」系が多い。愛読メディアは日経新聞。富裕層は4タイプ（プレミアムリッチ38%／情報リッチ24%／コンビニリッチ24%／ミーハーリッチ14%）に分類。所得源は労働所得48%が最多、株より不動産投資を好む（変動リスクが低く相続優遇もあるため）。70%以上が同じ仕事を20年以上継続、借金をしない堅実さが特徴。

■ 富裕層のダークサイド
・富裕層ほどダークトライアド（マキャベリズム・サイコパス性・ナルシシズム）的傾向が強まる研究。低所得層の方が他人の苦悩に敏感、高所得層は感情に流されにくくなる。年収が高いほど寄付割合は低くなる傾向。時間の使い方はアクティブレジャー中心（受け身の暇つぶしが少ない）。

■ ミリオネア・マインドの身につけ方（資産120億以上）
・共通する5性格：①感情の安定性が高い②誠実性が高い③外向的④開放的（好奇心旺盛）⑤協調性は低い（流されない）。貯蓄を増やす3つの方法：①ノスタルジックなアイテムを使う（懐かしい思い出に浸ると貯蓄意欲67%増）②ビジュアルモチベーター（貯蓄の目的を可視化）③自動化（給料天引きで自動貯蓄・投資）。

■ ミリオネア・ルート（大富豪へ続く4つの道）
①貯蓄系投資家（22%、平均30〜40年）②カンパニークライマー（31%、平均22年、大企業でハードワーク）③スペシャリスト（19%、平均20年、資格職）④ドリーマー（28%、平均12年、起業家・アーティスト等、リスクとストレスが最大）。ミリオネアの8つの共通習慣：①個人的責任を取る（97%）②出費が少なく貯蓄が多い（94%）③未来志向④ハードワーカー⑤定期的な投資（個別株ではなくインデックス中心）⑥借金をしない⑦予算内で暮らす（93%）⑧長期的な意識を持つ。

■ 金持ちになりたいならまずやめるべきTOP3
①固定費を見直さない習慣をやめる②貯金だけしていて投資しない状態をやめる（収入の10%以上を安定投資に）③見栄消費（高級車・過度なブランド品）をやめる。お金を稼ぐ目的は自由と不安の解消。自己投資はスキルや体験に使うべきでブランド品は該当しない。整形より先に自力でできること（スキンケア・体型管理）をやり切るべき。

■ 客家大富豪の教えから考察する「人脈と投資の技術」
・客家（東洋のユダヤ人と呼ばれる華僑の一派）の教え。ビジネスには大義名分が必要。信用は小さな約束を守れるかで測る。「3」という数字は人を信じさせる力を持つ。投資すべきはプラスサムゲーム（市場全体が広がるビジネス）、予想できない未来（ギャンブル）ではなく予想できる未来（訓練で確率を上げられるもの）に投資する。人生を変える50人と集中的に付き合う「複利思考」（50×50×50＝12.5万人のネットワークにつながる）。欠点を直すより長所を伸ばす方が価値を生む。`},
{title:"心理学でfire", status:"done", body:`心理学的アプローチでFIRE（早期リタイア）を目指す全4部シリーズ（1つは重複ページのため実質3本を要約）。

■ 第一部：20代「種まきフェーズ」
・DaiGo流FIRE＝「やりたくない仕事をやめて自由になる」こと。金融教育は早いほど良く、投資しないのは仕事の半分をサボっているのと同じ。教育年数を1年延ばすと生涯所得が平均8〜9%増える研究。
・入金力（稼いで投資に回す力）が全て。就職開始が1年遅れると退職時の貯蓄額が平均500万円減る研究。ボーナス等の臨時収入は全額投資に回す。20代は借金（特にリボ払い等の高金利）を絶対に作らない。副業は10〜20代から始めるべき（月5万円の副収入を確立し投資に回す）。
・「福利」の力を最大限利用：5%の福利で10年後1.6倍、20年後2.6倍、30年後4.3倍。ミニマリスト的な節約体質を20代で身につけると生涯効いてくる。健康（運動・食事・睡眠）は最大の投資であり、若い頃の不摂生は将来の医療費という「マイナス複利」になる。

■ 第二部：30〜40代「加速フェーズ」
・毎月10万円を年利5%で30年運用すると8323万円（貯金のみだと3600万円）。給料が上がっても生活水準を上げず、上がった分は全額インデックス投資に回す（ライフスタイルインフレの回避）。転職を戦略的に繰り返し市場価値と年収を上げる。
・長期投資はインデックスファンド一本が最適（プロのアクティブファンドの86%以上が10年で市場平均に負ける研究）。副業を月数万円→数十万円規模までスケールアップさせる。週55時間以上労働は心疾患リスク上昇（WHO報告）、燃え尽き症候群に注意。ライフイベント（結婚・出産・介護等）に合わせて計画を柔軟に見直す。ジオアービトラージ（生活コストの低い地域への移住）も選択肢。ファイヤー直前は資産配分を守り寄りに調整する。

■ 番外編：50〜60代「資産少なくても間に合う」
・「支出ゼロベース化」で家賃・車・保険などの固定費を徹底削減。「ファイヤースコア」＝安全資産÷（必要生活費−副収入）×12で算出、25以上でファイヤー圏内、30以上で安全圏。
・「年金繰り下げ受給」は実質利回り5〜8%のリスクゼロ投資に相当（70歳開始で42%増、75歳開始で84%増）。多くの人が損失回避バイアスで繰り下げを選ばない（日本の厚生年金受給者で選ぶのはわずか1.3%）。
・月10万円の副業は資産3000万円分の運用に匹敵。ストレスの低い副業（清掃・警備・スキル販売・資産活用型（民泊・メルカリ等））を選ぶ。持ち家は「攻めの資産」として住み替え・賃貸・リバースモーゲージで最適化。
・投資は「守り9・攻め1」で退場リスクゼロを目指す。資産を「現金バケット（生活費2年分）」「債券バケット（3〜7年分）」「株式バケット（7年以上先の分）」に分けて暴落時の狼狽売りを防ぐ「バケット戦略」。取り崩し率は4%ルールより保守的な3.3%を推奨。公的制度（在職老齢年金、青色申告控除、自治体減免等）を漏れなく活用。焦りと欲によるハイリスク投資（FX・レバレッジ・仮想通貨全振り）が最大の落とし穴。`},
{title:"二十代でやっておくべき", status:"done", body:`■ 誕生日特別放送：20代のうちにやっておくべき7つのこと
①習慣を作る（習慣化に必要な期間は66日、運動と食事の習慣が特に脳に効く。節目は習慣リセットのチャンス）②読書（出版社や著者ごとの傾向を掴めるようになる、継続すると必要な本が分かるようになる）③チャンスへの瞬発力（リスクが取れるうちに動く、メンターの有無は関係ない）④人を読む力（メンターを盲目的に信じない、素で付き合えない関係は辛い、他人に期待しすぎない）⑤可能性を追い求める（ルールを盲信せず分析してブルーオーシャンを探す）⑥無理をする（自分の限界がやりたいことを教えてくれる）⑦夢中になること、そしてそれを手放すこと。

■ なぜただのパフォーマーだった私がビジネスで成果を上げられたのか
・大手に真似されない強みを持つ（誰でもできることは単価が下がる）。お金のためより「強烈な好き」の方が才能になる。現状に満足できず独立するのは視野が狭く失敗しやすい（「置かれた場所で咲きなさい」は半分正解、成功した満足感の中で次を考えるのが良い）。
・楽しくないと感じたら成長のチャンス（飽きずに続けるには変わるしかない、飽きたら別ジャンルに関連性を見つけて移る）。自分のスキルは半分捨てて整理する。未経験の分野に飛び込むチーム構成が良い。就職せず自分の頭を使う（お金を使わず頭を使う）。似た者同士のバディは潰し合いやすく、異なるタイプ×自立した者同士の組み合わせが良い。飽きっぽさは才能（超好きなことしか続かない）。`},
{title:"エロ", status:"done", body:`カップルの性生活に関する心理学・医学研究のまとめ（8サブページ）。センシティブな内容のため、研究知見を中心に要点のみ記載。

■ 性生活の満足度を高める要素
・合意の上でのラフなセックスは男女ともオーガズム頻度を増やす研究（経験者は約半数）。乳首への愛撫は多くの女性が好むが、男女とも恥ずかしくて言い出しにくい傾向。年齢を重ねても「質」にこだわれば満足度は下がらない（回数は減っても質を高める工夫が鍵）。ヨガやマインドフルネスは性欲・感度の向上に有効（特に女性）。良いセックスの後は48時間ほど幸福度が上がる「アフターグロー効果」がある。

■ 性感が低下する要因（ハーバード医科大学系研究）
・長期交際・年齢・性欲の不一致・オナニーの影響（女性はマイナス、男性は影響なし）・健康状態やうつ・関係への倦怠感などが要因。改善策として日常的な軽いスキンシップの習慣化、オープンな対話、潤滑剤の適切な使用、段階的な「感覚フォーカストレーニング」（性器に触れない段階から始め徐々に進める、パートナー間の信頼構築が目的）が紹介されている。

■ セックスレスとその予防
・セックスの頻度は女性側の抵抗感に左右されやすい研究。男女で性欲の強さや浮気の心理（男性は性欲のはけ口、女性は関係性重視の傾向）に差があるとする研究。家事の公平な分担が性的満足度と相関するという指摘。

■ 女性の性感・オーガズムに関する研究
・クリトリスが感覚の中心という説（いわゆる「Gスポット」は内部クリトリスの一部とする説）。パートナーの経済力・自信・清潔感が女性の満足度に影響するという進化心理学的研究。マインドフルネス・マッサージ・骨盤底筋トレーニングなどが感度向上に関連するとされる。

■ マルチプルオーガズムとアンチエイジング
・定期的な性生活とアンチエイジング（見た目年齢）の相関を示す研究。男女ともトレーニングでコントロール力を高められるという内容（呼吸法・骨盤底筋・段階的な刺激コントロールなど）。

■ 関係満足度を高める心理学（38,747人対象の大規模調査）
・満足度の高いカップルに共通する行動：前戯を大切にする、日常的なコミュニケーション、自己受容とボディイメージの向上、性的嗜好をお互いに理解する、マッサージや入浴を共にする、新しい体位や刺激を時々取り入れる、「する日」を決めて頻度を保つなど。ADHD傾向がある人は性的な問題を抱えやすいという臨床研究、外見への自己満足度が性的な悩みの少なさと相関するという研究も紹介。

■ 会話（ピロートーク）の科学
・男性は身体的興奮と性器反応が比例するが、女性は身体の反応と精神的興奮が必ずしも一致しない（会話や安心感による興奮づくりが重要）という研究。性行為後の会話（ピロートーク）は関係満足度を高め、次の機会にも良い影響を与える。効果が高いとされる会話パターンは「親密な感情を伝える会話」「ポジティブなフィードバック」など。共同作業（映画鑑賞や感想の共有など）はオキシトシン分泌を通じて関係性を深めるとされる。`},
{title:"ストレス", status:"done", body:`■ 耐え難いストレスを力に変える心理学①③（全3回中2回分）
・「ストレスは体に悪い」と思っている人だけ、強いストレスで死亡リスクが43%上がる研究（スタンフォード大学の教科書より）。マインドセット次第でストレスは「自分を奮い立たせる力」にも「体を蝕むもの」にもなる。マインドセット効果はプラセボより長期的に人生を変える。
・強いストレスを力に変える3ステップ：①ストレスを感じていることを素直に認める（体の反応を観察）②強いストレスは「大事なものが脅かされているサイン」と捉え直す③そのエネルギーで何ができるか考える。「ストレスが溜まった」と楽しそうに口に出すのも長期的に効果的。
・良いストレス反応には「チャレンジ反応」（フロー状態に入る）と「思いやり絆反応」（オキシトシン分泌で人助けの勇気が湧く、心臓や血管の修復にも寄与）がある。嫌なことがあったら人助けをすると良い。
・幸せな人は「強いストレス＋前向きな捉え方」を持ち、不幸な人は「ストレスがない＋怒り」を抱えている傾向（何もすることがない人はむしろ不幸になりやすい）。毎日15分の「価値観日記」（自分の価値観のためにどう頑張ったかを記録）で短期的には自信・自尊心・レジリエンスが向上し、長期的には成績やメンタルヘルスの改善につながる。
・ストレスを避けようとすると体力・自制心・集中力が落ち鬱になりやすい。ポジティブな人とネガティブな人の違いは「不安の有無」ではなく「上手くやれるという自信の有無」（不安自体は消えなくても良い）。ストレスを感じやすい人の方がプレッシャー下で高いパフォーマンスを出せる研究（ただしマインドセット介入をしていないと逆効果）。
・「チャレンジ反応」は自分の強みを知ることで起きやすくなり、老化が緩やかになり脳容積が増える効果も報告されている。どうしようもない時は他者を助けると良い（時間がないと感じている時ほど人助けをすると余裕が生まれる。助ける相手は近い人より遠い人の方が効果的という指摘）。`},
{title:"食事　健康", status:"done", body:`■ 人生の質はカロリーの質で決まる〜10食材
・カロリーの質＝カロリーに対する栄養素の量。おすすめ10食材：①サバ（ビタミンD・オメガ3・セレン、鯖缶が便利）②サーモン（オメガ3豊富でオメガ6が少ない）③イカ（低カロリー高タンパク、ビタミンB2）④キャベツ（ビタミンK・U）⑤ほうれん草⑥ブロッコリー（スルフォラファン、切って30分置くと成分増加）⑦もやし（鉄分・ビタミンK・C、コスパ良好）⑧椎茸（ビタミンD・βグルカン）⑨舞茸（タンパク質分解酵素、うまみ成分グアニル酸）⑩コーヒー（低カロリーで抗酸化作用）。野菜は茎・軸・皮も含めて食べるのが基本。

■ いくら金をかけても損しないTOP10（食材・健康編）
・お金をかけて得する分野ランキング：①食事（高いものではなく美味しいものを）②睡眠（質が落ちると外見的魅力が3割低下する研究、収入にも影響）③定期的な運動（1日30分の運動は抗うつ剤1本相当）④教育とスキルアップ⑤人間関係（幸福度のほぼ全てを決める、モノより体験をシェアできることにお金を使う）。食材面ではきのこ（テアニンで睡眠の質向上）、卵（長寿者は毎日食べる傾向）、生魚・低温調理魚（酸化していないオメガ3）、海藻（低カロリー高栄養）、アーモンド（食物繊維が豊富）を推奨。

■ 花粉症対策〜食事で軽減する10要素
・根本治療は病院へ（舌下免疫療法が唯一の完治法）。食事での軽減には腸内環境改善と抗酸化物質摂取が鍵：①プロバイオティクス（発酵食品）②ビタミンC③ビタミンD④オメガ3⑤食物繊維⑥フラバノール（カカオ等）⑦ケルセチン（玉ねぎの皮等）⑧ポリフェノール⑨マグネシウム⑩亜鉛。若いうちの食事投資は将来の医療費を大きく左右するという考え方（「食への投資は取り返せないが、金銭的な投資の失敗はリスクを取れば取り返せる」）。

■ カロリーハック〜外食すら帳消しにする食事術
・イエール大学の研究：カロリーの質＝①満足度②吸収率③効率性（体脂肪への変換率）④栄養素の4要素で決まる。質の高いカロリーは低品質カロリーよりダイエット効果が2倍以上（体脂肪減少率86.5%との報告）。
・カロリーの質ランキング：①低糖質野菜（生で食べられるもの）②肉・魚・卵③脂肪分④フルーツ・高糖質野菜、の順に高品質。逆に乳製品・豆類・穀類・加工食品は質が低い。黄金比は野菜5割・タンパク質3割・脂質とフルーツ各1割。1日の野菜目安は800g〜1kg（拳10個分）。タンパク質は体重×1.6〜2gが目安。

■ ガリガリ卒業！健康的に太る4戦略
①腸内環境を改善する（栄養吸収率を上げる）②カロリー密度の高い食品を選ぶ（ナッツ・アボカド・ココナッツオイル等）③カロリーを飲み物で摂る（脳が満腹と認識しにくい）④マインドレスイーティング（動画を見ながら食べる、間食を目につく場所に置く）。

■ 天才は食べ物で作られる！脳にいい12食品
・脳の回転を悪くする10の食習慣（甘いもの依存、朝食抜き、揚げ物、野菜不足、精白食品、水分不足、炭酸飲料、過度な飲酒、不規則な食事時間、空腹でない間食）。
・オメガ3（サケ・サバ・くるみ等、DHAはセロトニン生成促進）、GABA系食品（ほうれん草が特に強力）、コリン（卵黄等、認知症予防）、各種ビタミンB群（B1はうつとやる気に、B3はセロトニン合成、B6は酵素反応、B9・B12は脳の老化予防）、抗酸化物質（ブルーベリー等のフラボノイドで記憶力30〜40%向上する研究）、緑茶のEGCgが特に強い抗酸化力を持つ。`},
{title:"筋トレの科学", status:"done", body:`■ 腕立て1回から始める「いい習慣を量産する技術」
・デューク大学の研究：人間の行動は45%が習慣、30%が睡眠に左右され、変えられるのはわずか25%。脳は急激な変化を嫌い「効率」と「ゆっくりとした変化」を好む。前頭葉（意志力）を使って大脳基底核（本能）に習慣を教え込むイメージ。
・小さな習慣を作る3条件：①馬鹿馬鹿しいほど小さく始める（腕立て1回など）②意思の力を必要としない③良い習慣を作るためにやる。運動習慣の定着には約256日かかる目安。60日は量を増やさず、疲れていない時や大型連休前に始めるのがコツ。ダイエットが続かない理由は「熱意低減の法則」（同じ刺激への感動は繰り返すほど減る）にあり、モチベーションより習慣化を重視すべき。

■ 人生を変える体脂肪率操作の科学
・腹筋が見える体脂肪率の目安は男性10%以下・女性15%以下。週に体脂肪が1%以上落ちるのは急激すぎて良くない。低テストステロンの症状（自覚しにくい）：焦り・やる気減退・息切れ・感動の減少・食後の眠気・浅い睡眠・ぼーっとする、など。
・体脂肪を落とす食事の基本：カロリーを極端に減らさない、糖質制限に頼りすぎない、タンパク質を増やす。バランスの目安は脂質40%・タンパク質20%・炭水化物40%。腹筋を割るのは筋トレより食事が重要。睡眠不足やストレスはテストステロンを下げ逆効果。

■ 1日4分のモテる体作りの科学〜魅力の70%を決める筋肉の付け方
・男性の魅力は筋肉が70%を占める研究（グリフィス大学）。モテる男性体型：大胸筋があり腹が引き締まっている、太っていると魅力が下がる、身長より筋肉の美しさが重要。カリフォルニア大学研究での体型人気順：①マッチョ②細マッチョ③ゴリマッチョ④痩せ⑤普通⑥ぽっちゃり（ただし結婚相手として見る場合は評価基準が変化する）。
・女性の場合は日本人にもスクワットが有効（太くならず引き締まる）。男性の握力はテストステロン値や成功と相関するという研究。身長の許容度は女性平均身長+10〜15cm程度が最もモテる傾向、極端な差（5cm以下・25cm以上）は好まれにくい。トレーニングとしてはバーピー系HIIT（ジャンプ＋腕立て）が心肺機能と上半身を同時に鍛えられ効率的。`},
{title:"HIIT", status:"done", body:`■ HIITの10のメリット（ミトコンドリアから人生を変える運動）
・HIIT（高強度インターバルトレーニング）はタバタ式が基本：20秒全力＋10秒休憩を4分間繰り返す（最大心拍数の90%目安）。1分あたり14.5kcal消費と時短効果が高く、45分以上の有酸素運動より優れる（長時間のランニングはコルチゾール増加・食欲増進で逆に痩せにくい）。
・10のメリット：①時短効果②空腹感が減る（食欲58%減、有酸素運動と違い空腹を誘発しにくい）③心疾患・糖尿病予防（インスリン分泌を3倍抑制）④アンチエイジング（体内の炎症を減らす）⑤最強の減量運動⑥脳血流の向上⑦内臓脂肪の激減（70代対象研究で10週間で内臓脂肪が3分の1に）⑧冷え性の改善⑨記憶力向上（30%向上）⑩長生きの可能性。女性の方が回復力が高くメリットが大きい傾向。毎日はやりすぎで2日に1回が目安。

■ HIITの極め方②：初級〜中級10種のトレーニング
①100メートルダッシュ×8本（初心者向け）②その場猛ダッシュ（もも上げ30秒・休憩10秒×20、かなりキツい）③タバタ式（20秒運動・10秒休憩×4を2セット、週4回で持久力19%・筋力13%UP）④クイーンズ大学式（バーピー等の筋トレをタバタ式で）⑤SITトレーニング（30秒全力・4分休憩×6、週2回で週3時間の運動と同等効果）⑥階段SIT⑦楽なSIT（60秒全力・60秒休憩×3、心肺機能8%向上）⑧1日1分以下のSIT⑨マクマスター大学式（高齢者向け、20秒全力・2分ゆっくり×3）⑩70歳でもできる高回転HIIT（8秒全力・12秒休憩×60、週40分で内臓脂肪25%減）。

■ HIITの極め方③：上級〜鬼向けトレーニング
・SITは約120%全力、HIITは約80%全力の感覚。DUP式HIIT（12週間かけて強度を段階的に上げる200メートルダッシュプログラム）でBMI3%減・体脂肪7%減・体力26%向上・インスリン抵抗性51%改善の報告。HIITと筋トレの組み合わせ方3ポイント：①筋トレを導入②全身の筋肉を使う③強度を上げる。「HIIT WB」（バーピー・マウンテンクライマー・スクワットスラスト・ジャンピングジャックを各20秒のタバタ式で）は4分で30分のランニング相当の効果とされる。

■ HIITの極め方④：DaiGo実践の3つの鬼トレーニング
・ノルウェー式HIIT（最もキツく効果が高い：5分ウォームアップ→4分全力＋3分休憩×4→5分クールダウン、最大心拍数の90%目安）は週3回12週間でミトコンドリアの性能が49%改善（高齢者では69%）する研究。DaiGoの週間ルーティンは①ノルウェー式（毎日、アレンジしたバーピー中心）②HIIPA（日常生活の中で20〜60秒の全力運動をこまめに挟む）③HIIT式筋トレ（週2回、ベンチプレス・スクワット・デッドリフト等を短時間高負荷で）④完全休養日を1日設ける。バーピーは米軍の身体能力テストにも使われる全身運動で、心肺機能はエアロバイクと同等、筋力面ではより優れるとされる。`},
{title:"ビジネス", status:"done", body:`■ 想像力で稼ぐ6つの方法（ペンシルベニア大学式）
①クリエイティブになると心に決める（決心するだけで視点が変わる）②歩く・散歩（森が最適、集中とは真逆の拡散思考を促す）③お風呂・シャワー（72%の人がシャワー中に良いアイデアを得た経験がある研究、朝が特に効果的）④孤独の時間を毎日1〜2時間作る（デフォルトモードネットワークを刺激）⑤アウトサイダーマインドセット（自分ではない誰かの視点で考える）⑥思考回数を増やす（アイデアの質より量・回数が重要）。逆にやってはいけないのは「音楽を聴きながら」「締切を作って」考えること。

■ 時代を変えるアイデアを作る14の創造性レシピ
①積極的行動と忍耐②不確実性への柔軟性③特定分野の知識と経験④全体的知性（IQとメンタルの健全さ）⑤結果を求めて形にする⑥自由と独立（他人のバイアスを避けるため一人で考える）⑦意図的な没頭と達成感情⑧オリジナリティ⑨前進と成長の感覚⑩他者とのシェアとコミュニケーション⑪完璧主義をやめ無意識に委ねる⑫潜在価値への評価⑬他者への貢献⑭多様性。要素はなるべく多く満たす方が良い。

■ スランプを突破する想像力クイックスキル（12個）
①「クリエイティブにやろう」と意識する②道具・材料を減らす（選択肢が少ない方が独創的になる研究）③楽しい気分になってから考える④目を左右に30秒動かす（右脳左脳の連携向上）⑤難解な小説や現代アートに触れる⑥お酒でほろ酔いになる⑦分析には赤、創造には青の色を使う⑧疲れた時・集中力が切れた時の方が発想しやすい⑨あえて休憩を挟み無関係なことをする（1.5倍思いつきやすい）⑩単純作業を間に挟む⑪子供のふりをして考える（内向的な人に特に有効）⑫遠い未来を想像する（抽象思考を強化）。

■ 人生変わる闇の力〜ネガティブ発想術（開放性の高め方）
①皮肉を言われるとクリエイティブになる（75%思いつきやすくなる研究）②疲れた時の方がアイデアが出やすい③集中力が落ちた時ほど発想しやすい④心配性・神経症的傾向が高い人はプレッシャー下で良いアイデアを出しやすい⑤ADHD傾向は常識・事前知識にとらわれない発想をしやすい⑥落ち込むと分析力が上がる（新規アイデアはポジティブ時、修正・練り直しはネガティブ時が向く）⑦孤独・退屈・ズルをする状況でクリエイティビティが上がる傾向⑧トラウマを乗り越えると想像力・幸福度が上がるという研究。

■ 【思いつく力】人生の問題を解決する13の習慣
・3種の想像力（空想的・エピソード的・洞察的）を使い分ける。①他者のために考える②一人で考えてから複数人で組み合わせる（集団ブレストは単体では非効率）③立って考える④褒められてから考える⑤サイコロジカルディスタンス（心理的・物理的に遠い視点を持つ）⑥暗い部屋（150ルクス）で考える⑦コーヒーよりお茶が創造性に有利⑧コスプレ・なりきりで自己イメージを変える⑨スーツを着る（抽象思考・自尊心が上がる）⑩夢を細かく思い出し採点する⑪あえて感情と行動に矛盾を作る⑫ヤヌス的思考（一見矛盾する2つが両立すると仮定して考える）。

■ 心理学的にバズる24のビジネスアイデアの作り方（前編・後編）
・「正しさより面白さ」が世に広まる鍵。面白いアイデアに共通する12パターン（＋その逆の12パターンで計24）：①法則があると思ったらデタラメ／その逆②単一要素と思ったら複合要素／その逆③小さな現象に大きな理由／その逆④レアケースが実は一般的／その逆⑤不変と思ったら変化していた／その逆⑥非効率と思ったら効率的／その逆⑦悪いと思われていたものが実は良い／その逆⑧無関係に見えて実は関係／その逆⑨セットだと思ったら両立しない／その逆⑩正の相関と思ったら負の相関／その逆⑪同じものと思ったら別物／その逆⑫結果だと思ったら原因（逆もまた然り）。このパターンリストで世の中のトレンドや自分のアイデアを分析できる。`},
];


const openSet = new Set();

function escapeHtml(str){
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function highlight(text, q){
  const escaped = escapeHtml(text);
  if(!q) return escaped;
  const escQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escaped.replace(new RegExp('(' + escQ + ')', 'ig'), '<mark>$1</mark>');
}

function formatBody(text, q){
  // ■ で始まる行を見出しとして装飾
  return text.split('\n').map(line => {
    if(line.trim().startsWith('■')){
      return '<span class="h">' + highlight(line.replace(/^\s*■\s*/,''), q) + '</span>';
    }
    return highlight(line, q);
  }).join('\n');
}

function render(){
  const q = document.getElementById('searchBox').value.trim();
  const ql = q.toLowerCase();
  const list = document.getElementById('list');
  list.innerHTML = "";
  let shown = 0;

  DATA.forEach((item, idx) => {
    const hay = (item.title + " " + item.body).toLowerCase();
    if(ql && !hay.includes(ql)) return;
    shown++;

    const card = document.createElement('div');
    card.className = 'card' + (openSet.has(idx) ? ' open' : '');

    const head = document.createElement('button');
    head.className = 'card-head';
    head.innerHTML = '<span class="chev"></span><span class="card-title">' + highlight(item.title, q) + '</span>';
    head.onclick = () => {
      if(openSet.has(idx)) openSet.delete(idx); else openSet.add(idx);
      render();
    };

    const body = document.createElement('div');
    body.className = 'card-body';
    let inner = "";
    if(item.subs && item.subs.length){
      inner += '<div class="sub-links">' + item.subs.map(s => '<span class="sub-link">' + escapeHtml(s) + '</span>').join('') + '</div>';
    }
    inner += '<div class="body-text">' + formatBody(item.body, q) + '</div>';
    body.innerHTML = inner;

    card.appendChild(head);
    card.appendChild(body);
    list.appendChild(card);
  });

  if(shown === 0){
    list.innerHTML = '<div class="empty">該当するテーマが見つかりませんでした。</div>';
  }
  document.getElementById('countLine').textContent = '全' + DATA.length + 'テーマ中 ' + shown + '件';
}

document.getElementById('searchBox').addEventListener('input', () => {
  const q = document.getElementById('searchBox').value.trim();
  if(q){
    // 検索中は該当テーマを自動で開く
    DATA.forEach((item, idx) => {
      if((item.title + " " + item.body).toLowerCase().includes(q.toLowerCase())) openSet.add(idx);
    });
  }
  render();
});

document.getElementById('expandAll').onclick = () => {
  DATA.forEach((_, i) => openSet.add(i));
  render();
};
document.getElementById('collapseAll').onclick = () => {
  openSet.clear();
  render();
};

render();
</script>
